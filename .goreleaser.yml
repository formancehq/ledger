# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
---
version: 2
project_name: ledger
dist: build/release

# Override these repositories for isolated image publication.
# The PR recipe sets PR_IMAGE_TAG and, when requested, PR_OPERATOR_TAG.
# An omitted operator tag skips the operator only in PR mode.
env:
- IMAGE_REPOSITORY={{ envOrDefault "IMAGE_REPOSITORY" "ghcr.io/formancehq/ledger" }}
- OPERATOR_IMAGE_REPOSITORY={{ envOrDefault "OPERATOR_IMAGE_REPOSITORY" "ghcr.io/formancehq/ledger-operator" }}

builds:
- binary: ledger-server
  id: ledger-server
  tags:
  - kafka
  - nats
  - clickhouse
  - databricks
  - s3
  - pyroscope
  ldflags:
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Version={{ .Version }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Commit={{ .ShortCommit }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.BuildDate={{ .Date }}
  - -extldflags=-static
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  goarch:
  - amd64
  - arm64

- binary: ledgerctl
  id: ledgerctl
  main: ./cmd/ledgerctl
  ldflags:
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Version={{ .Version }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Commit={{ .ShortCommit }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.BuildDate={{ .Date }}
  - -extldflags=-static
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  goarch:
  - amd64
  - arm64

- binary: ledgerctl
  id: ledgerctl-windows
  main: ./cmd/ledgerctl
  ldflags:
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Version={{ .Version }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Commit={{ .ShortCommit }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.BuildDate={{ .Date }}
  - -extldflags=-static
  env:
  - CGO_ENABLED=0
  goos:
  - windows
  goarch:
  - amd64
  - arm64

- id: operator
  binary: operator
  dir: misc/operator
  main: ./cmd/operator
  # The standalone perf build only publishes the Ledger image.
  skip: '{{ if and (index .Env "PR_IMAGE_TAG") (not (index .Env "PR_OPERATOR_TAG")) }}true{{ else }}false{{ end }}'
  ldflags:
  - '-X main.version={{ if index .Env "PR_IMAGE_TAG" }}{{ .Env.PR_OPERATOR_TAG }}{{ else if .IsNightly }}{{ if index .Env "DEV_VERSION" }}v{{ end }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}'
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  goarch:
  - amd64
  - arm64

nightly:
  tag_name: nightly
  publish_release: true
  # Archive names embed the nightly version, so replace the previous nightly
  # release instead of accumulating one archive set per commit on it.
  keep_single_release: true
  # RFC-0013: the main-branch nightly takes the SemVer development version
  # computed by formancehq/ci/actions/dev-version (e.g. 3.1.0-0.dev.12.g1a2b3c4).
  # Without DEV_VERSION, for example `just release-ci` run outside the
  # Release-Latest job, it keeps the historical nightly-<short-commit> form.
  version_template: '{{ if index .Env "DEV_VERSION" }}{{ .Env.DEV_VERSION }}{{ else if index .Env "PR_IMAGE_TAG" }}{{ .Env.PR_IMAGE_TAG }}{{ else }}nightly-{{ .ShortCommit }}{{ end }}'

release:
  disable: '{{ if index .Env "PR_IMAGE_TAG" }}true{{ else }}false{{ end }}'
  prerelease: auto
  extra_files:
  - glob: openapi.yml
  - glob: misc/operator/config/crd/schemas/*.json

# Archive names carry the version (e.g. ledger_v3.0.0_linux-amd64.tar.gz) so
# several releases can be downloaded side by side. `ledgerctl upgrade` matches
# this layout in cmd/ledgerctl/upgrade/github.go.
archives:
- id: ledger-unix
  ids:
  - ledger-server
  - ledgerctl
  formats:
  - tar.gz
  name_template: '{{ .ProjectName }}_{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}_{{ .Os }}-{{ .Arch }}'
  wrap_in_directory: true
- id: ledger-windows
  ids:
  - ledgerctl-windows
  formats:
  - zip
  name_template: '{{ .ProjectName }}_{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}_{{ .Os }}-{{ .Arch }}'
  wrap_in_directory: true

# Catalog the actual downloaded archives, including their Go dependencies.
sboms:
- id: archive-spdx
  artifacts: archive
  documents: ["${artifact}.spdx.json"]
  # Inventory the archive without network enrichment during release.
  args: ["$artifact", "--output", "spdx-json=$document"]
  disable: "{{ .IsNightly }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  # Keep tagged and nightly releases independent of remote compare APIs.
  use: git
  filters:
    exclude:
    - "^docs(\\([^)]*\\))?!?:"
    - "^chore(\\([^)]*\\))?!?:"
    - "^ci(\\([^)]*\\))?!?:"
  groups:
  - title: "New Features"
    regexp: "^.*feat(\\([^)]*\\))?!?:.*$"
    order: 0
  - title: "Bug fixes"
    regexp: "^.*fix(\\([^)]*\\))?!?:.*$"
    order: 10
  - title: "Other work"
    order: 999

dockers_v2:
- id: ledger
  ids:
  - ledger-server
  - ledgerctl
  dockerfile: build.Dockerfile
  images:
  - "{{ .Env.IMAGE_REPOSITORY }}"
  tags:
  # Releases and SemVer development builds (DEV_VERSION) get a leading v, like
  # Git tags. This covers main nightlies and PR images.
  - '{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}'
  - "{{ if not .IsNightly }}{{ if not .Prerelease }}latest{{ end }}{{ end }}"
  # Compatibility alias for consumers of the former nightly-<short-commit>
  # image tag, on main nightlies only; empty (skipped) for releases and PR images.
  - '{{ if and .IsNightly (index .Env "DEV_VERSION") (not (index .Env "PR_IMAGE_TAG")) }}nightly-{{ .ShortCommit }}{{ end }}'
  # PR images keep their pr-<num>-<sha7>[-run-<id>-<attempt>] tag next to the
  # development version. Without DEV_VERSION that tag is already {{ .Version }}.
  - '{{ if and (index .Env "PR_IMAGE_TAG") (index .Env "DEV_VERSION") }}{{ .Env.PR_IMAGE_TAG }}{{ end }}'
  platforms:
  - linux/amd64
  - linux/arm64
  sbom: "{{ not .IsNightly }}"
  flags:
  # PR image builds enable provenance; retain the existing release default.
  - '--provenance={{ envOrDefault "IMAGE_PROVENANCE" "false" }}'
  labels:
    org.opencontainers.image.title: ledger
    org.opencontainers.image.description: ledger
    org.opencontainers.image.url: https://github.com/formancehq/ledger
    org.opencontainers.image.source: https://github.com/formancehq/ledger
    org.opencontainers.image.version: "{{ .Version }}"
    org.opencontainers.image.created: "{{ time \"2006-01-02T15:04:05Z07:00\" }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.licenses: MIT

- id: operator
  ids:
  - operator
  dockerfile: misc/operator/build.Dockerfile
  disable: '{{ if and (index .Env "PR_IMAGE_TAG") (not (index .Env "PR_OPERATOR_TAG")) }}true{{ else }}false{{ end }}'
  images:
  - "{{ .Env.OPERATOR_IMAGE_REPOSITORY }}"
  tags:
  - '{{ if index .Env "PR_IMAGE_TAG" }}{{ .Env.PR_OPERATOR_TAG }}{{ else }}{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}{{ end }}'
  - '{{ if and (not .IsNightly) (not .Prerelease) }}latest{{ end }}'
  platforms:
  - linux/amd64
  - linux/arm64
  sbom: "{{ not .IsNightly }}"
  flags:
  - '--provenance={{ envOrDefault "IMAGE_PROVENANCE" "false" }}'
  labels:
    org.opencontainers.image.title: ledger-operator
    org.opencontainers.image.description: ledger-operator
    org.opencontainers.image.url: https://github.com/formancehq/ledger
    org.opencontainers.image.source: https://github.com/formancehq/ledger
    org.opencontainers.image.version: "{{ .Version }}"
    org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.licenses: MIT
