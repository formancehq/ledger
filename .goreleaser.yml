# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
---
version: 2
project_name: ledger

# IMAGE_REPOSITORY controls where Docker images are pushed. Override the env
# var to publish to a different GHCR location. Default targets the canonical
# `formancehq/ledger` published image.
env:
- IMAGE_REPOSITORY={{ envOrDefault "IMAGE_REPOSITORY" "ghcr.io/formancehq/ledger" }}

builds:
- binary: ledger-server
  id: ledger-server
  tags:
  - kafka
  - nats
  - clickhouse
  - databricks
  - s3
  - pyroscope
  ldflags:
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Version={{ .Version }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Commit={{ .ShortCommit }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.BuildDate={{ .Date }}
  - -extldflags=-static
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  goarch:
  - amd64
  - arm64

- binary: ledgerctl
  id: ledgerctl
  main: ./cmd/ledgerctl
  ldflags:
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Version={{ .Version }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Commit={{ .ShortCommit }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.BuildDate={{ .Date }}
  - -extldflags=-static
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  goarch:
  - amd64
  - arm64

- binary: ledgerctl
  id: ledgerctl-windows
  main: ./cmd/ledgerctl
  ldflags:
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Version={{ .Version }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.Commit={{ .ShortCommit }}
  - -X github.com/formancehq/ledger/v3/internal/pkg/version.BuildDate={{ .Date }}
  - -extldflags=-static
  env:
  - CGO_ENABLED=0
  goos:
  - windows
  goarch:
  - amd64
  - arm64

nightly:
  tag_name: nightly
  publish_release: true
  version_template: nightly-{{ .ShortCommit }}

release:
  prerelease: auto
  extra_files:
  - glob: openapi.yml

archives:
- id: ledger-unix
  ids:
  - ledger-server
  - ledgerctl
  formats:
  - tar.gz
  name_template: "{{ .ProjectName }}_{{ .Os }}-{{ .Arch }}"
  wrap_in_directory: true
- id: ledger-windows
  ids:
  - ledgerctl-windows
  formats:
  - zip
  name_template: "{{ .ProjectName }}_{{ .Os }}-{{ .Arch }}"
  wrap_in_directory: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^chore:"
    - "^ci:"

dockers_v2:
- ids:
  - ledger-server
  - ledgerctl
  dockerfile: build.Dockerfile
  images:
  - "{{ .Env.IMAGE_REPOSITORY }}"
  tags:
  - "{{ if not .IsNightly }}v{{ end }}{{ .Version }}"
  - "{{ if not .IsNightly }}{{ if not .Prerelease }}latest{{ end }}{{ end }}"
  platforms:
  - linux/amd64
  - linux/arm64
  sbom: false
  flags:
  - --provenance=false
  labels:
    org.opencontainers.image.title: ledger
    org.opencontainers.image.description: ledger
    org.opencontainers.image.url: https://github.com/formancehq/ledger
    org.opencontainers.image.source: https://github.com/formancehq/ledger
    org.opencontainers.image.version: "{{ .Version }}"
    org.opencontainers.image.created: "{{ time \"2006-01-02T15:04:05Z07:00\" }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.licenses: MIT
