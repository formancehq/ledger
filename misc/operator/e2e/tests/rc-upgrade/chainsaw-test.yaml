apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rc-upgrade
spec:
  timeouts:
    assert: 10m
  steps:
    - name: Start from the published RC
      try:
        - apply:
            file: cluster.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-required-upgrade
              status:
                readyReplicas: 3
    - name: Write data and record workload and storage identities
      try:
        - script:
            content: |
              set -eu
              kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl provision run marketplace --scale 0.5 --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"'
              transactions=$(kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl transactions list --ledger marketplace --all --json --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"')
              printf '%s\n' "$transactions" | jq -e 'length > 0' >/dev/null
              data_file=$(mktemp)
              trap 'rm -f "$data_file"' EXIT
              printf '%s\n' "$transactions" > "$data_file"
              kubectl create configmap required-upgrade-expected-data -n "$NAMESPACE" --from-file=transactions="$data_file"
              kubectl get statefulset ledger-required-upgrade -n "$NAMESPACE" -o jsonpath='{.metadata.uid}' > /tmp/required-upgrade-sts-"$NAMESPACE"
              for ordinal in 0 1 2; do
                kubectl get pod ledger-required-upgrade-"$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}' > /tmp/required-upgrade-pod-"$NAMESPACE"-"$ordinal"
                for volume in wal data; do
                  kubectl get pvc "$volume-ledger-required-upgrade-$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}' > /tmp/required-upgrade-pvc-"$NAMESPACE"-"$volume"-"$ordinal"
                done
              done
            timeout: 180s
    - name: Request the configured adjacent RC upgrade
      try:
        - script:
            env:
              - name: UPGRADE_MODE
                value: ($values.upgradeMode)
              - name: TARGET_REPOSITORY
                value: ($values.targetRepository)
              - name: TARGET_TAG
                value: ($values.targetTag)
              - name: TARGET_PULL_POLICY
                value: ($values.targetPullPolicy)
            content: |
              set -eu
              kubectl patch cluster required-upgrade -n "$NAMESPACE" --type merge \
                -p "{\"spec\":{\"image\":{\"repository\":\"$TARGET_REPOSITORY\",\"tag\":\"$TARGET_TAG\",\"pullPolicy\":\"$TARGET_PULL_POLICY\"}}}"
              if [ "$UPGRADE_MODE" = stopped ]; then
                # Observe the transition while it runs. A new Pod must never
                # coexist with any Pod from the source workload.
                for attempt in $(seq 1 600); do
                  pods=$(kubectl get pods -n "$NAMESPACE" -o json)
                  old_present=false
                  new_present=false
                  for ordinal in 0 1 2; do
                    old_uid=$(cat /tmp/required-upgrade-pod-"$NAMESPACE"-"$ordinal")
                    if printf '%s' "$pods" | jq -e --arg uid "$old_uid" '.items[] | select(.metadata.uid == $uid)' >/dev/null; then
                      old_present=true
                    fi
                  done
                  for pod_uid in $(printf '%s' "$pods" | jq -r '.items[] | select(.metadata.name | startswith("ledger-required-upgrade-")) | .metadata.uid'); do
                    known=false
                    for ordinal in 0 1 2; do
                      [ "$pod_uid" = "$(cat /tmp/required-upgrade-pod-"$NAMESPACE"-"$ordinal")" ] && known=true
                    done
                    [ "$known" = true ] || new_present=true
                  done
                  if [ "$old_present" = true ] && [ "$new_present" = true ]; then
                    echo 'Old and new voter Pods overlapped during stopped upgrade'
                    exit 1
                  fi
                  new_sts=$(kubectl get statefulset ledger-required-upgrade -n "$NAMESPACE" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
                  old_sts=$(cat /tmp/required-upgrade-sts-"$NAMESPACE")
                  if [ -n "$new_sts" ] && [ "$new_sts" != "$old_sts" ] && [ "$old_present" = false ]; then
                    break
                  fi
                  sleep 1
                done
                [ "$attempt" -lt 600 ] || { echo 'Stopped upgrade did not replace the StatefulSet'; exit 1; }
              fi
            timeout: 650s
    - name: Wait for the configured update
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-required-upgrade
              spec:
                template:
                  spec:
                    containers:
                      - name: ledger
                        image: (join(':', [$values.targetRepository, $values.targetTag]))
        - script:
            content: |
              set -eu
              kubectl rollout status statefulset/ledger-required-upgrade -n "$NAMESPACE" --timeout=5m
              kubectl get statefulset ledger-required-upgrade -n "$NAMESPACE" -o json |
                jq -e '.status.observedGeneration >= .metadata.generation and .status.currentRevision == .status.updateRevision' >/dev/null
            timeout: 310s
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-required-upgrade
              status:
                readyReplicas: 3
                updatedReplicas: 3
        - assert:
            resource:
              apiVersion: ledger.formance.com/v1alpha1
              kind: Cluster
              metadata:
                name: required-upgrade
              status:
                (upgrade == null): true
    - name: Verify the workload, claims and business data
      try:
        - script:
            env:
              - name: UPGRADE_MODE
                value: ($values.upgradeMode)
            content: |
              set -eu
              old_sts=$(cat /tmp/required-upgrade-sts-"$NAMESPACE")
              new_sts=$(kubectl get statefulset ledger-required-upgrade -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
              case "$UPGRADE_MODE" in
                rolling)
                  [ "$old_sts" = "$new_sts" ] || { echo 'Rolling upgrade recreated StatefulSet'; exit 1; }
                  ;;
                stopped)
                  [ "$old_sts" != "$new_sts" ] || { echo 'Stopped upgrade did not recreate StatefulSet'; exit 1; }
                  ;;
                *) echo "Unknown upgrade mode: $UPGRADE_MODE"; exit 1 ;;
              esac
              for ordinal in 0 1 2; do
                old_pod=$(cat /tmp/required-upgrade-pod-"$NAMESPACE"-"$ordinal")
                new_pod=$(kubectl get pod ledger-required-upgrade-"$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
                [ "$old_pod" != "$new_pod" ] || { echo "Pod $ordinal was not replaced"; exit 1; }
                for volume in wal data; do
                  old_claim=$(cat /tmp/required-upgrade-pvc-"$NAMESPACE"-"$volume"-"$ordinal")
                  new_claim=$(kubectl get pvc "$volume-ledger-required-upgrade-$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
                  [ "$old_claim" = "$new_claim" ] || { echo "PVC $volume/$ordinal changed"; exit 1; }
                done
              done
              kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl ledgers list --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"' | grep marketplace
              expected=$(kubectl get configmap required-upgrade-expected-data -n "$NAMESPACE" -o jsonpath='{.data.transactions}' | jq -cS .)
              actual=$(kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl transactions list --ledger marketplace --all --json --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"' | jq -cS .)
              [ "$actual" = "$expected" ] || { echo 'Marketplace transactions changed during upgrade'; exit 1; }
              # Both upgrade paths retain PVCs. Permit Chainsaw's namespace
              # cleanup only after all preservation assertions have passed.
              for ordinal in 0 1 2; do
                for volume in wal data; do
                  claim="$volume-ledger-required-upgrade-$ordinal"
                  pv=$(kubectl get pvc "$claim" -n "$NAMESPACE" -o jsonpath='{.spec.volumeName}')
                  kubectl annotate pv "$pv" formance.com/allow-deletion=true --overwrite
                  kubectl annotate pvc "$claim" -n "$NAMESPACE" formance.com/allow-deletion=true --overwrite
                done
              done
            timeout: 120s
