apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: incremental-backup
spec:
  timeouts:
    assert: 5m
  steps:
    - name: Create S3 bucket
      try:
        - script:
            content: |
              kubectl run mc-incr --rm -i --restart=Never \
                --image=ghcr.io/formancehq/minio:RELEASE.2025-10-15T17-29-55Z --image-pull-policy=IfNotPresent --command \
                --env=MC_HOST_minio=http://minioadmin:minioadmin@minio.minio.svc.cluster.local:9000 \
                -- mc mb --ignore-existing minio/e2e-incr-backup
            timeout: 60s

    - name: Deploy Cluster
      try:
        - apply:
            file: cluster.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-bk-incr-cluster
              status:
                readyReplicas: 1

    - name: Provision initial data
      try:
        - script:
            content: |
              kubectl exec ledger-bk-incr-cluster-0 -n $NAMESPACE -c ledger -- \
                /bin/sh -c './ledgerctl provision run gaming-wallet --scale 0.5 --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"'
            timeout: 120s

    - name: Create backup destination
      try:
        - apply:
            file: backup.yaml

    - name: Run first checkpoint backup
      try:
        - apply:
            file: first-run.yaml
        - assert:
            resource:
              apiVersion: ledger.formance.com/v1alpha1
              kind: BackupRun
              metadata:
                name: first-checkpoint
              status:
                phase: Succeeded
        - assert:
            file: assert-full-done.yaml

    # Insert new data after the first checkpoint.
    - name: Provision additional data
      try:
        - script:
            content: |
              kubectl exec ledger-bk-incr-cluster-0 -n $NAMESPACE -c ledger -- \
                /bin/sh -c './ledgerctl provision run subscription --scale 0.5 --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"'
            timeout: 120s

    - name: Run second checkpoint backup
      try:
        - apply:
            file: second-run.yaml
        - assert:
            resource:
              apiVersion: ledger.formance.com/v1alpha1
              kind: BackupRun
              metadata:
                name: second-checkpoint
              status:
                phase: Succeeded

    - name: Verify S3 content
      try:
        - script:
            content: |
              set -eu
              cd "$(git rev-parse --show-toplevel)/misc/operator"
              first_sequence=$(kubectl get backuprun first-checkpoint -n "$NAMESPACE" -o jsonpath='{.status.result.lastLogSequence}')
              second_sequence=$(kubectl get backuprun second-checkpoint -n "$NAMESPACE" -o jsonpath='{.status.result.lastLogSequence}')
              bucket_id=$(kubectl get cluster bk-incr-cluster -n "$NAMESPACE" -o jsonpath='{.spec.clusterID}')
              test -n "$first_sequence"
              test -n "$second_sequence"
              test -n "$bucket_id"
              test_name=TestRepeatedCheckpointBackup_S3Objects
              go test -tags e2e -count=1 -list "^${test_name}$" ./e2e/... | grep -Fqx "${test_name}"
              BACKUP_BUCKET_ID="$bucket_id" FIRST_CHECKPOINT_SEQUENCE="$first_sequence" SECOND_CHECKPOINT_SEQUENCE="$second_sequence" \
                go test -tags e2e -v -count=1 -run "^${test_name}$" -timeout 30s ./e2e/...
            timeout: 60s
