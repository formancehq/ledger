apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-config-rotation
spec:
  timeouts:
    assert: 5m
  steps:
    # 1. Deploy Cluster with initial cache + bloom configuration.
    - name: Deploy Cluster
      try:
        - apply:
            file: cluster.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-ccr-cluster
              status:
                readyReplicas: 1

    # 2. Verify the initial ClusterConfig is propagated to the running cluster.
    - name: Verify initial cluster_config
      try:
        - script:
            content: |
              OUT=$(kubectl exec ledger-ccr-cluster-0 -n $NAMESPACE -c ledger -- \
                /bin/sh -c './ledgerctl cluster status --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET" --json')
              echo "$OUT"
              ROT=$(echo "$OUT" | sed -n 's/.*"rotationThreshold":[^0-9]*\([0-9]*\).*/\1/p' | head -1)
              [ "$ROT" = "1000" ] || { echo "FAIL: expected rotationThreshold=1000, got $ROT"; exit 1; }
              echo "OK: initial rotationThreshold=1000"
            timeout: 60s

    # 3. Record initial spec-hash and pod UID.
    - name: Record initial state
      try:
        - script:
            content: |
              HASH=$(kubectl get statefulset ledger-ccr-cluster -n $NAMESPACE \
                -o jsonpath='{.spec.template.metadata.annotations.ledger\.formance\.com/spec-hash}')
              POD_UID=$(kubectl get pod ledger-ccr-cluster-0 -n $NAMESPACE -o jsonpath='{.metadata.uid}')
              [ -n "$HASH" ] || { echo "FAIL: spec-hash annotation not set"; exit 1; }
              kubectl annotate namespace $NAMESPACE \
                e2e-initial-hash="$HASH" \
                e2e-initial-pod-uid="$POD_UID" \
                --overwrite
            timeout: 30s

    # 4. Patch cache + bloom config — triggers a rolling restart.
    - name: Apply updated config
      try:
        - apply:
            file: cluster-updated.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-ccr-cluster
              status:
                readyReplicas: 1

    # 5. Verify the rolling update happened (spec-hash + pod UID changed).
    - name: Verify rolling update happened
      try:
        - script:
            content: |
              INITIAL_HASH=$(kubectl get namespace $NAMESPACE -o jsonpath='{.metadata.annotations.e2e-initial-hash}')
              INITIAL_UID=$(kubectl get namespace $NAMESPACE -o jsonpath='{.metadata.annotations.e2e-initial-pod-uid}')

              NEW_HASH=$(kubectl get statefulset ledger-ccr-cluster -n $NAMESPACE \
                -o jsonpath='{.spec.template.metadata.annotations.ledger\.formance\.com/spec-hash}')
              [ "$INITIAL_HASH" != "$NEW_HASH" ] || { echo "FAIL: spec-hash did not change"; exit 1; }
              echo "OK: spec-hash changed ($INITIAL_HASH -> $NEW_HASH)"

              for i in $(seq 1 60); do
                NEW_UID=$(kubectl get pod ledger-ccr-cluster-0 -n $NAMESPACE -o jsonpath='{.metadata.uid}' 2>/dev/null)
                READY=$(kubectl get pod ledger-ccr-cluster-0 -n $NAMESPACE -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
                if [ "$NEW_UID" != "$INITIAL_UID" ] && [ "$READY" = "True" ]; then
                  echo "OK: pod was replaced (old=$INITIAL_UID new=$NEW_UID)"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: pod was not replaced"
              exit 1
            timeout: 360s

    # 6. Verify new env vars are present in the container spec.
    - name: Verify env vars propagated
      try:
        - script:
            content: |
              GET_ENV() {
                kubectl get statefulset ledger-ccr-cluster -n $NAMESPACE \
                  -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='$1')].value}"
              }
              ROT=$(GET_ENV CACHE_ROTATION_THRESHOLD)
              [ "$ROT" = "2000" ] || { echo "FAIL: CACHE_ROTATION_THRESHOLD=$ROT (want 2000)"; exit 1; }
              KEYS=$(GET_ENV BLOOM_VOLUMES_EXPECTED_KEYS)
              [ "$KEYS" = "50000" ] || { echo "FAIL: BLOOM_VOLUMES_EXPECTED_KEYS=$KEYS (want 50000)"; exit 1; }
              LM_KEYS=$(GET_ENV BLOOM_LEDGER_METADATA_EXPECTED_KEYS)
              [ "$LM_KEYS" = "5000" ] || { echo "FAIL: BLOOM_LEDGER_METADATA_EXPECTED_KEYS=$LM_KEYS (want 5000)"; exit 1; }
              echo "OK: env vars propagated"
            timeout: 10s

    # 7. Verify the new ClusterConfig is observed at runtime
    #    (Raft proposeClusterConfigIfNeeded runs on the new leader).
    - name: Verify ClusterConfig converged
      try:
        - script:
            content: |
              for i in $(seq 1 60); do
                OUT=$(kubectl exec ledger-ccr-cluster-0 -n $NAMESPACE -c ledger -- \
                  /bin/sh -c './ledgerctl cluster status --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET" --json' 2>/dev/null)
                ROT=$(echo "$OUT" | sed -n 's/.*"rotationThreshold":[^0-9]*\([0-9]*\).*/\1/p' | head -1)
                if [ "$ROT" = "2000" ]; then
                  echo "OK: rotationThreshold converged to 2000 after $((i*5))s"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: rotationThreshold did not converge to 2000"
              echo "$OUT"
              exit 1
            timeout: 360s

    # 8. A new member starts with the updated local threshold while the donor
    #    still retains both ClusterConfig entries in its WAL.
    - name: Add fresh member after threshold change
      try:
        - apply:
            file: cluster-scaled.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-ccr-cluster
              status:
                readyReplicas: 3

    # 9. The fresh learner must fetch the donor's checkpoint before applying
    #    retained entries. This assertion fails if the startup guard is removed.
    - name: Verify fresh member synchronized before replay
      try:
        - script:
            content: |
              set -e
              for pod in ledger-ccr-cluster-1 ledger-ccr-cluster-2; do
                kubectl logs "$pod" -n "$NAMESPACE" -c ledger \
                  | grep -q 'Startup recovery requires synchronization with leader'
              done
              for i in $(seq 1 30); do
                VOTERS=$(kubectl exec ledger-ccr-cluster-0 -n "$NAMESPACE" -c ledger -- \
                  /bin/sh -c './ledgerctl cluster status --json --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"' \
                  | grep -c '"suffrage": "Voter"' || true)
                [ "$VOTERS" -eq 3 ] && exit 0
                sleep 5
              done
              echo "FAIL: fresh member was not promoted to voter"
              exit 1
            timeout: 180s

    # 10. A business proposal made at the donor's epoch must be visible from
    #     the new member. An extra epoch rotation during replay rejects it.
    - name: Verify business proposal on all members
      try:
        - script:
            content: |
              set -e
              kubectl exec ledger-ccr-cluster-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl ledgers create en3393-replay --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"'
              for pod in ledger-ccr-cluster-0 ledger-ccr-cluster-1 ledger-ccr-cluster-2; do
                LEDGER=$(kubectl exec "$pod" -n "$NAMESPACE" -c ledger -- \
                  /bin/sh -c './ledgerctl ledgers get en3393-replay --json --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"')
                echo "$LEDGER" | jq -e '.name == "en3393-replay"'
              done
            timeout: 60s
