apiVersion: ledger.formance.com/v1alpha1
kind: Cluster
metadata:
  name: ccr-cluster
spec:
  replicas: 3
  image:
    repository: ledger
    tag: e2e
    pullPolicy: Never
  cache:
    rotationThreshold: 2000
  raft:
    maintenanceInterval: 1h
  bloom:
    volumes:
      expectedKeys: 50000
      fpRate: "0.001"
    ledgerMetadata:
      expectedKeys: 5000
      fpRate: "0.01"
