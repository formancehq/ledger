apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-credentials
type: Opaque
stringData:
  access-key-id: minioadmin
  secret-access-key: minioadmin
---
apiVersion: ledger.formance.com/v1alpha1
kind: Backup
metadata:
  name: manual-bk
spec:
  clusterRef: bk-manual-cluster
  destination:
    driver: s3
    s3:
      bucket: e2e-manual-backup
      region: us-east-1
      endpoint: http://minio.minio.svc.cluster.local:9000
    s3AccessKeyIdFrom:
      name: backup-s3-credentials
      key: access-key-id
    s3SecretAccessKeyFrom:
      name: backup-s3-credentials
      key: secret-access-key
  # No schedule: this Backup is a configuration template for manual runs only.
