apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rolling-rc-upgrade
spec:
  timeouts:
    assert: 10m
  steps:
    - name: Start from the published RC
      try:
        - apply:
            file: cluster.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-required-upgrade
              status:
                readyReplicas: 3
    - name: Write data and record workload and storage identities
      try:
        - script:
            content: |
              set -eu
              kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl provision run marketplace --scale 0.5 --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"'
              transactions=$(kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl transactions list --ledger marketplace --all --json --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"')
              printf '%s\n' "$transactions" | jq -e 'length > 0' >/dev/null
              data_file=$(mktemp)
              trap 'rm -f "$data_file"' EXIT
              printf '%s\n' "$transactions" > "$data_file"
              kubectl create configmap required-upgrade-expected-data -n "$NAMESPACE" --from-file=transactions="$data_file"
              kubectl get statefulset ledger-required-upgrade -n "$NAMESPACE" -o jsonpath='{.metadata.uid}' > /tmp/required-upgrade-sts-"$NAMESPACE"
              for ordinal in 0 1 2; do
                kubectl get pod ledger-required-upgrade-"$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}' > /tmp/required-upgrade-pod-"$NAMESPACE"-"$ordinal"
                for volume in wal data; do
                  kubectl get pvc "$volume-ledger-required-upgrade-$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}' > /tmp/required-upgrade-pvc-"$NAMESPACE"-"$volume"-"$ordinal"
                done
              done
            timeout: 180s
    - name: Request the rolling rc.2 to rc.3 upgrade
      try:
        - apply:
            file: cluster-updated.yaml
    - name: Wait for the rolling update
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ledger-required-upgrade
              spec:
                template:
                  spec:
                    containers:
                      - name: ledger
                        image: ledger:v3.0.0-rc.3
              status:
                readyReplicas: 3
                updatedReplicas: 3
        - assert:
            resource:
              apiVersion: ledger.formance.com/v1alpha1
              kind: Cluster
              metadata:
                name: required-upgrade
              status:
                (upgrade == null): true
    - name: Verify the StatefulSet, claims and business data
      try:
        - script:
            content: |
              set -eu
              old_sts=$(cat /tmp/required-upgrade-sts-"$NAMESPACE")
              new_sts=$(kubectl get statefulset ledger-required-upgrade -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
              [ "$old_sts" = "$new_sts" ] || { echo 'StatefulSet was unexpectedly recreated'; exit 1; }
              for ordinal in 0 1 2; do
                old_pod=$(cat /tmp/required-upgrade-pod-"$NAMESPACE"-"$ordinal")
                new_pod=$(kubectl get pod ledger-required-upgrade-"$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
                [ "$old_pod" != "$new_pod" ] || { echo "Pod $ordinal was not replaced"; exit 1; }
                for volume in wal data; do
                  old_claim=$(cat /tmp/required-upgrade-pvc-"$NAMESPACE"-"$volume"-"$ordinal")
                  new_claim=$(kubectl get pvc "$volume-ledger-required-upgrade-$ordinal" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
                  [ "$old_claim" = "$new_claim" ] || { echo "PVC $volume/$ordinal changed"; exit 1; }
                done
              done
              kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl ledgers list --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"' | grep marketplace
              expected=$(kubectl get configmap required-upgrade-expected-data -n "$NAMESPACE" -o jsonpath='{.data.transactions}' | jq -cS .)
              actual=$(kubectl exec ledger-required-upgrade-0 -n "$NAMESPACE" -c ledger -- \
                /bin/sh -c './ledgerctl transactions list --ledger marketplace --all --json --server 127.0.0.1:8888 --insecure --auth-token "$CLUSTER_SECRET"' | jq -cS .)
              [ "$actual" = "$expected" ] || { echo 'Marketplace transactions changed during upgrade'; exit 1; }
              # The rolling upgrade retains PVCs. Permit Chainsaw's namespace
              # cleanup only after all preservation assertions have passed.
              for ordinal in 0 1 2; do
                for volume in wal data; do
                  claim="$volume-ledger-required-upgrade-$ordinal"
                  pv=$(kubectl get pvc "$claim" -n "$NAMESPACE" -o jsonpath='{.spec.volumeName}')
                  kubectl annotate pv "$pv" formance.com/allow-deletion=true --overwrite
                  kubectl annotate pvc "$claim" -n "$NAMESPACE" formance.com/allow-deletion=true --overwrite
                done
              done
            timeout: 120s
