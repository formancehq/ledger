apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ledger-next-operator.fullname" . }}-pre-delete
  labels:
    {{- include "ledger-next-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ledger-next-operator.fullname" . }}-pre-delete
  labels:
    {{- include "ledger-next-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
rules:
- apiGroups: ["ledger-next.formance.com"]
  resources: ["credentials"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ledger-next-operator.fullname" . }}-pre-delete
  labels:
    {{- include "ledger-next-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
subjects:
- kind: ServiceAccount
  name: {{ include "ledger-next-operator.fullname" . }}-pre-delete
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ledger-next-operator.fullname" . }}-pre-delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ledger-next-operator.fullname" . }}-pre-delete
  labels:
    {{- include "ledger-next-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ledger-next-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ledger-next-operator.fullname" . }}-pre-delete
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
      - name: delete-credentials
        image: docker.io/bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command:
        - /bin/sh
        - -ec
        - |
          # Credentials are cluster-scoped: watchNamespace cannot scope this
          # cleanup. Delete only the next API group's Credentials while the
          # operator can still finalize their cross-namespace Secrets.
          kubectl delete credentials.ledger-next.formance.com --all \
            --ignore-not-found --wait --timeout=60s
          echo "done"
