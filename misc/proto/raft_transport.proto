syntax = "proto3";

package raft_transport;

option go_package = "github.com/formancehq/ledger/v3/internal/proto/rafttransportpb";

// RaftTransportService handles Raft message transport between nodes
service RaftTransportService {
  // StreamMessages establishes a client streaming connection for sending Raft messages
  // This avoids frequent reconnections by maintaining a persistent connection
  rpc StreamMessages(stream SendMessageRequest) returns (stream SendMessageResponse);
}

// LogIntegrityService exposes a bounded digest of the durable log stream to
// other members of the Raft cluster. It is served only on the internal port.
service LogIntegrityService {
  rpc GetRangeDigest(GetRangeDigestRequest) returns (GetRangeDigestResponse);
}

message GetRangeDigestRequest {
  fixed64 first_log_sequence = 1;
  fixed64 last_log_sequence = 2;
  // The requester sampled this durable Raft index with its log range. The
  // receiver waits for it before reading a pinned Pebble snapshot.
  fixed64 min_applied_index = 3;
}

message GetRangeDigestResponse {
  fixed64 first_log_sequence = 1;
  fixed64 last_log_sequence = 2;
  bytes digest = 3;
  uint32 digest_version = 4;
  fixed64 applied_index = 5;
  fixed64 last_log_sequence_on_node = 6;
}

message RaftRequestMessage {
  fixed64 id = 1;
  bytes message = 2;
}

// RaftRequestBatch contains multiple Raft messages to send in a single request
message RaftRequestBatch {
  repeated RaftRequestMessage messages = 1;
}

message RaftResponseMessage {
  fixed64 request_id = 1;
  bool success = 2;
  string error = 3;
}

// RaftResponseBatch contains multiple Raft responses
message RaftResponseBatch {
  repeated RaftResponseMessage messages = 1;
}

message PingMessage {
  fixed64 seq_id = 1;
}

message PongResponse {
  fixed64 seq_id = 1;
}

// SendMessageRequest contains Raft messages to send
message SendMessageRequest {
  oneof message {
    RaftRequestBatch raft = 1;
    PingMessage ping = 2;
  }
}

// SendMessageResponse is the response to SendMessage
message SendMessageResponse {
  oneof message {
    RaftResponseBatch raft = 1;
    PongResponse pong = 2;
  }
}


