
syntax = "proto3";

package ledger;

option go_package = "github.com/formancehq/ledger/v3/internal/proto/servicepb";

import "common.proto";
import "audit.proto";
import "signature.proto";
import "google/protobuf/descriptor.proto";

// allowed_skippable_reasons annotates a oneof case inside LedgerAction.data
// with the business ErrorReasons a caller may list in
// LedgerApplyRequest.skippable_reasons for that action. protoc-gen-skippable
// (misc/proto → tools/protoc-gen-skippable) reads these annotations and
// generates internal/proto/servicepb/bucket_skippable.pb.go — admission's
// extractSkippableReasonsFromApply consumes that generated table so the
// whitelist stays co-located with the wire declaration.
//
// A oneof case without the annotation has NO whitelist: any non-empty
// LedgerApplyRequest.skippable_reasons on that action is rejected at
// admission.
//
// Field number 71001 sits in a range outside the taken slots of
// transitive dependencies (etcd uses 50000-50003, gogoproto uses
// 62000-65012, google.api uses 72295728+) — collisions in the
// same-message×same-number key would panic at runtime during package init.
extend google.protobuf.FieldOptions {
  repeated common.ErrorReason allowed_skippable_reasons = 71001;
}

// ============================================================================
// gRPC Service
// ============================================================================

// BucketService provides ledger operations
service BucketService {
  // ListLedgers streams all ledgers info in the cluster
  rpc ListLedgers(ListLedgersRequest) returns (stream common.LedgerInfo);
  // GetLedger returns a ledger info by its name or ID
  rpc GetLedger(GetLedgerRequest) returns (common.LedgerInfo);
  // GetAccount retrieves an account by address
  rpc GetAccount(GetAccountRequest) returns (common.Account);
  // GetTransaction retrieves a transaction by ID
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  // ListTransactions streams all transactions for a ledger (newest first)
  rpc ListTransactions(ListTransactionsRequest) returns (stream common.Transaction);
  // ListAccounts streams all accounts for a ledger (alphabetical order)
  rpc ListAccounts(ListAccountsRequest) returns (stream common.Account);
  // Apply applies actions (create/delete ledger, create transaction, revert, save/delete metadata)
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // GetPrimaryMetrics returns metrics from the primary Pebble store. Supports node_id targeting.
  rpc GetPrimaryMetrics(GetPrimaryMetricsRequest) returns (GetPrimaryMetricsResponse);
  // GetSecondaryMetrics returns metrics from the secondary (read index) Pebble store. Supports node_id targeting.
  rpc GetSecondaryMetrics(GetSecondaryMetricsRequest) returns (GetSecondaryMetricsResponse);
  // CheckStore verifies store integrity (hash chain and derived data consistency)
  rpc CheckStore(CheckStoreRequest) returns (stream CheckStoreEvent);
  // ListAuditEntries streams audit trail entries (success and failure)
  rpc ListAuditEntries(ListAuditEntriesRequest) returns (stream audit.AuditEntry);
  // GetAuditEntry returns a single audit entry by sequence number
  rpc GetAuditEntry(GetAuditEntryRequest) returns (audit.AuditEntry);
  // GetEventsSinks returns the current per-sink configurations and statuses
  rpc GetEventsSinks(GetEventsSinksRequest) returns (GetEventsSinksResponse);
  // ListChapters streams all chapters
  rpc ListChapters(ListChaptersRequest) returns (stream common.Chapter);
  // ListLogs streams system logs; when ledger is set, streams only logs for that ledger
  rpc ListLogs(ListLogsRequest) returns (stream common.Log);
  // GetLog returns a single system log by sequence number
  rpc GetLog(GetLogRequest) returns (common.Log);
  // GetChapterSchedule returns the current automatic chapter rotation schedule
  rpc GetChapterSchedule(GetChapterScheduleRequest) returns (GetChapterScheduleResponse);
  // ListSigningKeys streams all registered signing keys
  rpc ListSigningKeys(ListSigningKeysRequest) returns (stream common.SigningKey);
  // Discovery returns server capabilities and configuration for clients
  rpc Discovery(DiscoveryRequest) returns (DiscoveryResponse);
  // GetMetadataSchemaStatus returns the declared type of every metadata field.
  rpc GetMetadataSchemaStatus(GetMetadataSchemaStatusRequest) returns (GetMetadataSchemaStatusResponse);
  // AnalyzeAccounts scans all accounts in a ledger and suggests a Chart of Accounts
  rpc AnalyzeAccounts(AnalyzeAccountsRequest) returns (stream AnalyzeAccountsEvent);
  // AnalyzeTransactions scans all transactions in a ledger and discovers flow patterns
  rpc AnalyzeTransactions(AnalyzeTransactionsRequest) returns (stream AnalyzeTransactionsEvent);
  // CreatePreparedQuery creates a named prepared query for a ledger
  rpc CreatePreparedQuery(CreatePreparedQueryRequest) returns (CreatePreparedQueryResponse);
  // UpdatePreparedQuery updates the filter of an existing prepared query
  rpc UpdatePreparedQuery(UpdatePreparedQueryRequest) returns (UpdatePreparedQueryResponse);
  // DeletePreparedQuery removes a prepared query
  rpc DeletePreparedQuery(DeletePreparedQueryRequest) returns (DeletePreparedQueryResponse);
  // ListPreparedQueries lists all prepared queries for a ledger
  rpc ListPreparedQueries(ListPreparedQueriesRequest) returns (ListPreparedQueriesResponse);
  // ExecutePreparedQuery executes a prepared query against the read index store
  rpc ExecutePreparedQuery(ExecutePreparedQueryRequest) returns (ExecutePreparedQueryResponse);
  // GetIndexStatus returns the current state of the read index builder
  rpc GetIndexStatus(GetIndexStatusRequest) returns (GetIndexStatusResponse);
  // GetIndex returns a single Index registry entry by (ledger, id).
  rpc GetIndex(GetIndexRequest) returns (common.Index);
  // GetIndexEntryStatus returns the per-index status view (registry entry +
  // backfill cursor + per-replica IndexVersionState) for a single index.
  rpc GetIndexEntryStatus(GetIndexEntryStatusRequest) returns (IndexEntry);
  // ListIndexes streams the bucket-scoped index registry, optionally filtered
  // to a single ledger (or to bucket-scoped indexes when ledger is empty).
  rpc ListIndexes(ListIndexesRequest) returns (stream common.Index);
  // GetLedgerStats returns aggregate statistics for a ledger
  rpc GetLedgerStats(GetLedgerStatsRequest) returns (common.LedgerStats);
  // AggregateVolumes returns per-asset aggregated volumes for filtered accounts
  rpc AggregateVolumes(AggregateVolumesRequest) returns (common.AggregateResult);
  // GetNumscript returns a numscript by name and optional version
  rpc GetNumscript(GetNumscriptRequest) returns (common.NumscriptInfo);
  // ListNumscripts streams all numscripts (latest version of each)
  rpc ListNumscripts(ListNumscriptsRequest) returns (stream common.NumscriptInfo);
  // GetTemplateUsage returns per-template invocation usage populated by the
  // usagebuilder subsystem. Eventually consistent — may lag the live FSM
  // by up to one usagebuilder tick interval.
  rpc GetTemplateUsage(GetTemplateUsageRequest) returns (common.TemplateUsage);
  // ListNumscriptVersions returns the latest pointer and every stored version
  // of a numscript, ordered greatest semver first.
  rpc ListNumscriptVersions(ListNumscriptVersionsRequest) returns (ListNumscriptVersionsResponse);
  // InspectIndex scans a metadata index and returns distinct values, facets, or a summary
  rpc InspectIndex(InspectIndexRequest) returns (InspectIndexResponse);
  // Barrier proposes a no-op through Raft consensus. When it returns, all
  // previously proposed entries are guaranteed to have been applied to the FSM.
  // Useful for ensuring read-after-write consistency across API calls.
  rpc Barrier(BarrierRequest) returns (BarrierResponse);
}

// ============================================================================
// gRPC Request/Response Messages
// ============================================================================

message GetAccountRequest {
  string ledger = 1;
  string address = 2;
  // checkpoint_id, when non-zero, reads from a query checkpoint instead of the live store
  fixed64 checkpoint_id = 3;
  // When true, colored buckets are summed into a single entry per asset
  // with color = "" in the returned Account.volumes list. By default each
  // (asset, color) tuple gets its own entry.
  bool collapse_colors = 4;
}

message GetTransactionRequest {
  string ledger = 1;
  fixed64 transaction_id = 2;
  // checkpoint_id, when non-zero, reads from a query checkpoint instead of the live store
  fixed64 checkpoint_id = 3;
}

message GetTransactionResponse {
  common.Transaction transaction = 1;
  string receipt = 2;  // JWT receipt (empty if signing key not configured)
}

message ListTransactionsRequest {
  string ledger = 1;
  common.ListOptions options = 2;
}

message ListAccountsRequest {
  string ledger = 1;
  common.ListOptions options = 2;
}

message CreateLedgerRequest {
  string name = 1;
  repeated common.SetMetadataFieldTypeCommand initial_schema = 2;
  common.LedgerMode mode = 3;
  common.MirrorSourceConfig mirror_source = 4;
  map<string, common.AccountType> account_types = 5;  // Initial account types
  common.ChartEnforcementMode default_enforcement_mode = 6;  // Default enforcement for unmatched accounts
}

message DeleteLedgerRequest {
  string name = 1;
}

message DeleteLedgerResponse {}

message ListLedgersRequest {
  common.ListOptions options = 1;
}

message GetLedgerRequest {
  string ledger = 1;
  common.ReadOptions read = 2;
}

// ApplyRequest is the wire input to Apply(): an atomic batch that is either
// unsigned (ApplyBatch carried directly) or signed (an opaque
// SignedApplyBatch whose payload is the serialized ApplyBatch). The
// discriminated union is schema-enforced — a client cannot send both, and the
// wrapper/payload divergence class disappears by construction.
//
// forwarded_caller_snapshot and skip_response sit OUTSIDE the signed payload:
// the snapshot is added by a forwarding follower (not client-signed), and
// skip_response is a response-shaping transport option, not part of the intent.
message ApplyRequest {
  oneof variant {
    ApplyBatch unsigned = 1;
    signature.SignedApplyBatch signed = 2;
  }

  // forwarded_caller_snapshot carries the admission-time caller snapshot
  // (identity + scopes + god) captured by the forwarding follower. The
  // leader honors this field ONLY when the incoming connection authenticates
  // via cluster-secret (trusted peer); direct client requests have it
  // derived from validated JWT/Ed25519 claims on the leader and any value
  // sent here is ignored.
  common.CallerSnapshot forwarded_caller_snapshot = 3;

  // skip_response, when true, strips log payloads from the response.
  // Only the sequence number is returned for each log. Useful for
  // historical ingestion where the client does not need the full response.
  bool skip_response = 4;
}

// ApplyBatch is the atomic unit: an ordered set of requests applied
// all-or-nothing, identified for idempotency by a single key. It is the unit
// of atomicity, idempotency, AND signing — a SignedApplyBatch signs exactly
// these bytes, so the batch's composition and ordering are authenticated.
message ApplyBatch {
  repeated Request requests = 1;
  string idempotency_key = 2;
}

message ApplyResponse {
  repeated common.Log logs = 1;
}

message Request {
  // Idempotency is keyed per atomic batch (ApplyBatch.idempotency_key),
  // matching the atomic/signed unit — never per individual request.
  oneof type {
    LedgerApplyRequest apply = 1;
    CreateLedgerRequest create_ledger = 2;
    DeleteLedgerRequest delete_ledger = 3;
    RegisterSigningKeyRequest register_signing_key = 4;
    RevokeSigningKeyRequest revoke_signing_key = 5;
    SetSigningConfigRequest set_signing_config = 6;
    AddEventsSinkRequest add_events_sink = 7;
    RemoveEventsSinkRequest remove_events_sink = 8;
    CloseChapterRequest close_chapter = 9;
    SealChapterRequest seal_chapter = 10;
    ArchiveChapterRequest archive_chapter = 11;
    ConfirmArchiveChapterRequest confirm_archive_chapter = 12;
    SetMaintenanceModeRequest set_maintenance_mode = 13;
    SetChapterScheduleRequest set_chapter_schedule = 14;
    DeleteChapterScheduleRequest delete_chapter_schedule = 15;
    SetMetadataFieldTypeRequest set_metadata_field_type = 16;
    RemoveMetadataFieldTypeRequest remove_metadata_field_type = 17;
    PromoteLedgerRequest promote_ledger = 18;
    CreatePreparedQueryRequest create_prepared_query = 19;
    UpdatePreparedQueryRequest update_prepared_query = 20;
    DeletePreparedQueryRequest delete_prepared_query = 21;
    CreateIndexRequest create_index = 22;
    DropIndexRequest drop_index = 23;
    SaveNumscriptRequest save_numscript = 24;
    AddAccountTypeLedgerRequest add_account_type = 25;
    RemoveAccountTypeLedgerRequest remove_account_type = 26;
    SetDefaultEnforcementModeLedgerRequest set_default_enforcement_mode = 27;
    CreateQueryCheckpointRequest create_query_checkpoint = 28;
    DeleteQueryCheckpointRequest delete_query_checkpoint = 29;
    SetQueryCheckpointScheduleRequest set_query_checkpoint_schedule = 30;
    DeleteQueryCheckpointScheduleRequest delete_query_checkpoint_schedule = 31;
    SaveLedgerMetadataRequest save_ledger_metadata = 32;
    DeleteLedgerMetadataRequest delete_ledger_metadata = 33;
    SetClusterPolicyRequest set_cluster_policy = 34;
  }
  // Signing happens at the batch level, never per request: a signed
  // ApplyRequest carries an opaque SignedApplyBatch whose payload is the
  // serialized ApplyBatch (these requests + the key).
}

// CreateQueryCheckpointRequest creates a query checkpoint via Raft.
// The checkpoint ID is assigned sequentially by the FSM.
message CreateQueryCheckpointRequest {}

// DeleteQueryCheckpointRequest removes a query checkpoint via Raft.
message DeleteQueryCheckpointRequest {
  fixed64 checkpoint_id = 1;
}

// SetClusterPolicyRequest updates the replicated cluster policy. Internal /
// control-plane only — constructed by the leader-side reconciler and not
// exposed via ClusterService.
message SetClusterPolicyRequest {
  common.ClusterPolicy policy = 1;
}

message PromoteLedgerRequest {
  string ledger = 1;
}

// SaveLedgerMetadataRequest sets metadata key-value pairs on a ledger.
message SaveLedgerMetadataRequest {
  string ledger = 1;
  map<string, common.MetadataValue> metadata = 2;
}

// DeleteLedgerMetadataRequest removes a single metadata key from a ledger.
message DeleteLedgerMetadataRequest {
  string ledger = 1;
  string key = 2;
}

// AddEventsSinkRequest adds or updates a named sink configuration.
message AddEventsSinkRequest {
  common.SinkConfig config = 1;
}

// RemoveEventsSinkRequest removes a named sink configuration.
message RemoveEventsSinkRequest {
  string name = 1;
}

// ============================================================================
// Signing Key Management Messages
// ============================================================================

// RegisterSigningKeyRequest registers an Ed25519 public key for signature verification.
// Bootstrap: when no keys are registered yet, this request can be unsigned.
// Once at least one key is registered, this request must be signed by an existing key.
message RegisterSigningKeyRequest {
  string key_id = 1;       // Unique identifier for this key
  bytes public_key = 2;    // Ed25519 public key (32 bytes)
}

// RevokeSigningKeyRequest removes a registered signing key.
// Must be signed by an existing key (cannot revoke all keys if require_signatures is enabled).
message RevokeSigningKeyRequest {
  string key_id = 1;       // Key ID to revoke
  bool cascade = 2;        // When true, also revoke all descendant keys
}

// SetSigningConfigRequest updates the signing configuration.
// Must be signed by an existing key when keys are registered.
message SetSigningConfigRequest {
  bool require_signatures = 1;   // Whether to reject unsigned requests
}

message ListSigningKeysRequest {
  common.ListOptions options = 1;
}

message CloseChapterRequest {}

message SealChapterRequest {
  fixed64 chapter_id = 1;
  bytes sealing_hash = 2;
  bytes state_hash = 3;
}

message ArchiveChapterRequest {
  fixed64 chapter_id = 1;
}

message ConfirmArchiveChapterRequest {
  fixed64 chapter_id = 1;
  // sealing_hash commits the confirm to one chapter incarnation. The FSM
  // compares it against the chapter's own sealing hash immediately before the
  // purge, so a confirm carrying a stale identity — an archiver holding a
  // request from a timeline a restore replaced — cannot delete hot history whose
  // archive belongs to a different incarnation.
  bytes sealing_hash = 2;
}

message ListChaptersRequest {
  common.ListOptions options = 1;
}

// SetMaintenanceModeRequest enables or disables maintenance mode.
// When enabled, all write operations are blocked except maintenance mode toggle.
message SetMaintenanceModeRequest {
  bool enabled = 1;   // Whether maintenance mode is active
}

// SetChapterScheduleRequest sets the automatic chapter rotation schedule.
message SetChapterScheduleRequest {
  string cron = 1;   // Cron expression (standard 5-field)
}

// DeleteChapterScheduleRequest disables the automatic chapter rotation schedule.
message DeleteChapterScheduleRequest {}

// SetMetadataFieldTypeRequest declares or changes the type of a single metadata key.
// Existing primary metadata values remain unchanged; attached indexes are rewritten.
message SetMetadataFieldTypeRequest {
  string ledger = 1;
  common.TargetType target_type = 2;
  string key = 3;
  common.MetadataType type = 4;
}

// RemoveMetadataFieldTypeRequest removes the type declaration for a single metadata key.
// Existing primary metadata values remain unchanged and an attached index is dropped.
message RemoveMetadataFieldTypeRequest {
  string ledger = 1;
  common.TargetType target_type = 2;
  string key = 3;
}


// CreateIndexRequest requests the creation of an index on a ledger.
message CreateIndexRequest {
  string ledger = 1;
  common.IndexID id = 2;
}

// DropIndexRequest requests the removal of an index from a ledger.
message DropIndexRequest {
  string ledger = 1;
  common.IndexID id = 2;
}

// ============================================================================
// Numscript Library Messages
// ============================================================================

// SaveNumscriptRequest appends an immutable version to the library. version
// must be an explicit full semver (e.g. "1.0.0").
message SaveNumscriptRequest {
  string name = 1;
  string content = 2;
  string version = 3;
  string ledger = 4;
}

// GetNumscriptRequest retrieves a numscript by name and version selector.
// version accepts an exact semver, a partial selector (e.g. "1", "1.2"), or
// "" / "latest" for the greatest stored semver.
message GetNumscriptRequest {
  string name = 1;
  string version = 2; // "" = latest (greatest stored semver)
  string ledger = 3;
  common.ReadOptions read = 4;
}

// ListNumscriptsRequest lists all numscripts for a ledger (greatest version of each).
message ListNumscriptsRequest {
  string ledger = 1;
  common.ListOptions options = 2;
}

// ListNumscriptVersionsRequest lists every stored version of a single numscript.
message ListNumscriptVersionsRequest {
  string ledger = 1;
  string name = 2;
  common.ReadOptions read = 3;
}

// ListNumscriptVersionsResponse carries the numscript's history: the current
// latest (greatest stored semver) and every stored version.
message ListNumscriptVersionsResponse {
  string latest_version = 1;
  repeated common.NumscriptVersionEntry versions = 2;
}

// GetTemplateUsageRequest retrieves the invocation counter + last-used
// timestamp for a Numscript template. The counter is materialised
// asynchronously by the usagebuilder from the audit chain — expect up to
// one tick interval of lag behind the live FSM.
message GetTemplateUsageRequest {
  string ledger = 1;
  string name = 2;
}

// ScriptReference references a numscript from the library by name and version.
message ScriptReference {
  string name = 1;
  string version = 2; // required: "latest" or an exact full semver
  map<string, string> vars = 3;
}

// SetQueryCheckpointScheduleRequest sets the automatic query checkpoint creation schedule.
message SetQueryCheckpointScheduleRequest {
  string cron = 1;   // Cron expression (standard 5-field or extended 6-field)
}

// DeleteQueryCheckpointScheduleRequest disables the automatic query checkpoint schedule.
message DeleteQueryCheckpointScheduleRequest {}

message GetChapterScheduleRequest {}

message GetChapterScheduleResponse {
  string cron = 1;   // Current cron expression, empty if disabled
}

// ============================================================================
// Discovery Messages
// ============================================================================

message DiscoveryRequest {}

// ServerInfo carries the server build metadata (unauthenticated).
message ServerInfo {
  string version = 1;     // semver / git tag (e.g. v3.1.0), "dev" if unset
  string commit = 2;      // git SHA, "unknown" if unset
  string build_date = 3;  // RFC3339, "unknown" if unset
  string go_version = 4;  // runtime Go version
}

message DiscoveryResponse {
  ResponseSigningInfo response_signing = 1;  // Response signing config (nil if disabled)
  ServerInfo server_info = 2;                // Server build metadata
}

// ResponseSigningInfo describes the server's response signing configuration.
message ResponseSigningInfo {
  bytes public_key = 1;    // Ed25519 public key (32 bytes)
  string key_id = 2;       // Key identifier (SHA256 fingerprint)
}

// ============================================================================
// Ledger Actions (used by Apply RPC)
// ============================================================================

// CreateTransactionPayload contains the data for creating a transaction
message CreateTransactionPayload {
  repeated common.Posting postings = 1;
  common.Script script = 2;
  common.Timestamp timestamp = 3;
  string reference = 4;
  map<string, common.MetadataValue> metadata = 5;
  map<string, common.MetadataMap> account_metadata = 6;
  bool force = 7;
  ScriptReference script_reference = 8;
}

// RevertTransactionPayload contains the data for reverting a transaction.
message RevertTransactionPayload {
  fixed64 transaction_id = 1;
  bool force = 2;
  bool at_effective_date = 3;
  map<string, common.MetadataValue> metadata = 4;
  string receipt = 5;
}

// LedgerAction represents a single ledger action.
//
// Each oneof case MAY carry an `(allowed_skippable_reasons)` annotation
// (see the extension declaration at the top of this file). Admission
// consumes the generated whitelist to validate LedgerApplyRequest
// .skippable_reasons; cases without the annotation reject any non-empty
// list from the caller.
message LedgerAction {
  oneof data {
    CreateTransactionPayload create_transaction = 1 [
      (allowed_skippable_reasons) = ERROR_REASON_TRANSACTION_REFERENCE_CONFLICT
    ];
    common.SaveMetadataCommand add_metadata = 2;
    RevertTransactionPayload revert_transaction = 3 [
      (allowed_skippable_reasons) = ERROR_REASON_TRANSACTION_ALREADY_REVERTED
    ];
    common.DeleteMetadataCommand delete_metadata = 4 [
      (allowed_skippable_reasons) = ERROR_REASON_METADATA_NOT_FOUND
    ];
    AddAccountTypeRequest add_account_type = 5 [
      (allowed_skippable_reasons) = ERROR_REASON_ACCOUNT_TYPE_ALREADY_EXISTS
    ];
    RemoveAccountTypeRequest remove_account_type = 6 [
      (allowed_skippable_reasons) = ERROR_REASON_ACCOUNT_TYPE_NOT_FOUND
    ];
    SetDefaultEnforcementModeRequest set_default_enforcement_mode = 7;
  }
}

message LedgerApplyRequest {
  string ledger = 1;
  LedgerAction action = 2;
  // Business error reasons the caller accepts to skip silently rather than
  // fail the proposal. The FSM records a common.OrderSkippedLog for each
  // matching skip; the proposal continues with Outcome=Success.
  //
  // Validated at admission against the per-action whitelist declared inline on
  // each LedgerAction.data oneof case via `(allowed_skippable_reasons)` (the
  // single source of truth; the generated SkippableReasonsForLedgerAction is
  // what admission consults). Today: CreateTransaction accepts
  // TRANSACTION_REFERENCE_CONFLICT, RevertTransaction TRANSACTION_ALREADY_REVERTED,
  // DeleteMetadata METADATA_NOT_FOUND, AddAccountType ACCOUNT_TYPE_ALREADY_EXISTS,
  // RemoveAccountType ACCOUNT_TYPE_NOT_FOUND. An opt-in on an action that
  // declares no annotation is rejected up front. Empty (default) preserves the
  // historical fail-fast behaviour.
  repeated common.ErrorReason skippable_reasons = 3;
}

// AddAccountTypeRequest adds an account type within a LedgerApplyRequest.
message AddAccountTypeRequest {
  common.AccountType account_type = 1;
}

// RemoveAccountTypeRequest removes an account type within a LedgerApplyRequest.
message RemoveAccountTypeRequest {
  string name = 1;
}

// SetDefaultEnforcementModeRequest sets the default enforcement mode within a LedgerApplyRequest.
message SetDefaultEnforcementModeRequest {
  common.ChartEnforcementMode enforcement_mode = 1;
}

// SetDefaultEnforcementModeLedgerRequest sets the default enforcement mode (top-level request).
message SetDefaultEnforcementModeLedgerRequest {
  string ledger = 1;
  common.ChartEnforcementMode enforcement_mode = 2;
}

// AddAccountTypeLedgerRequest adds an account type (top-level request).
message AddAccountTypeLedgerRequest {
  string ledger = 1;
  common.AccountType account_type = 2;
}

// RemoveAccountTypeLedgerRequest removes an account type (top-level request).
message RemoveAccountTypeLedgerRequest {
  string ledger = 1;
  string name = 2;
}

// ============================================================================
// Store Metrics Messages
// ============================================================================

message GetPrimaryMetricsRequest {
  // node_id indicates which node to query (0 = local node)
  uint32 node_id = 1;
}

message GetPrimaryMetricsResponse {
  // available indicates if metrics are available (false for non-Pebble stores)
  bool available = 1;
  // metrics contains the Pebble metrics (only set if available is true)
  PebbleMetrics metrics = 2;
}

message GetSecondaryMetricsRequest {
  // node_id indicates which node to query (0 = local node)
  uint32 node_id = 1;
}

message GetSecondaryMetricsResponse {
  // available indicates if the secondary store is active
  bool available = 1;
  // metrics contains the secondary Pebble metrics (only set if available is true)
  PebbleMetrics metrics = 2;
}

// PebbleMetrics contains metrics from the Pebble storage engine
message PebbleMetrics {
  BlockCacheMetrics block_cache = 1;
  CompactMetrics compact = 2;
  FlushMetrics flush = 3;
  MemTableMetrics mem_table = 4;
  SnapshotsMetrics snapshots = 5;
  TableMetrics table = 6;
  TableCacheMetrics table_cache = 7;
  WALMetrics wal = 8;
  KeysMetrics keys = 9;
  repeated LevelMetrics levels = 10;
  fixed64 disk_space_usage = 11;
}

message BlockCacheMetrics {
  int64 size = 1;
  int64 count = 2;
  int64 hits = 3;
  int64 misses = 4;
}

message CompactMetrics {
  int64 count = 1;
  int64 default_count = 2;
  int64 delete_only_count = 3;
  int64 elision_only_count = 4;
  int64 move_count = 5;
  int64 read_count = 6;
  int64 rewrite_count = 7;
  int64 multi_level_count = 8;
  fixed64 estimated_debt = 9;
  int64 in_progress_bytes = 10;
  int64 num_in_progress = 11;
  int32 marked_files = 12;
}

message FlushMetrics {
  int64 count = 1;
  int64 num_in_progress = 2;
  fixed64 as_ingest_count = 3;
  fixed64 as_ingest_table_count = 4;
  fixed64 as_ingest_bytes = 5;
}

message MemTableMetrics {
  fixed64 size = 1;
  int64 count = 2;
  fixed64 zombie_size = 3;
  int64 zombie_count = 4;
}

message SnapshotsMetrics {
  int32 count = 1;
  fixed64 earliest_seq_num = 2;
  fixed64 pinned_keys = 3;
  fixed64 pinned_size = 4;
}

message TableMetrics {
  fixed64 zombie_size = 1;
  int64 zombie_count = 2;
  fixed64 backing_table_count = 3;
  fixed64 backing_table_size = 4;
}

message TableCacheMetrics {
  int64 size = 1;
  int64 count = 2;
  int64 hits = 3;
  int64 misses = 4;
}

message WALMetrics {
  int64 files = 1;
  int64 obsolete_files = 2;
  fixed64 size = 3;
  fixed64 bytes_in = 4;
  fixed64 bytes_written = 5;
}

message KeysMetrics {
  fixed64 range_key_sets_count = 1;
  fixed64 tombstone_count = 2;
}

message LevelMetrics {
  int32 level = 1;
  int64 num_files = 2;
  int64 size = 3;
  double score = 4;
  fixed64 bytes_in = 5;
  fixed64 bytes_ingested = 6;
  fixed64 bytes_moved = 7;
  fixed64 bytes_read = 8;
  fixed64 bytes_compacted = 9;
  fixed64 bytes_flushed = 10;
  fixed64 tables_compacted = 11;
  fixed64 tables_flushed = 12;
  fixed64 tables_ingested = 13;
  fixed64 tables_moved = 14;
}

// ============================================================================
// Store Check Messages
// ============================================================================

message CheckStoreRequest {}

message CheckStoreEvent {
  oneof type {
    CheckStoreError error = 1;
    CheckStoreProgress progress = 2;
  }
}

enum CheckStoreErrorType {
  CHECK_STORE_ERROR_TYPE_UNSPECIFIED = 0;
  CHECK_STORE_ERROR_TYPE_HASH_MISMATCH = 1;
  CHECK_STORE_ERROR_TYPE_SEQUENCE_GAP = 2;
  CHECK_STORE_ERROR_TYPE_VOLUME_MISMATCH = 3;
  CHECK_STORE_ERROR_TYPE_METADATA_MISMATCH = 4;
  CHECK_STORE_ERROR_TYPE_UNKNOWN_LEDGER = 5;
  CHECK_STORE_ERROR_TYPE_TRANSACTION_UPDATE_MISMATCH = 6;
  CHECK_STORE_ERROR_TYPE_REVERTED_MISMATCH = 7;
  // Emitted when the (ledger, account, asset) tuples persisted in
  // AppliedProposal.TransientVolumes or LedgerLog.PurgedVolumes do not
  // match the set the replay-time SimulateEphemeralPurge derived for the
  // same proposal. Surfaces corruption on the unhashed projection caches
  // the index builder consumes — the audit hash chain itself is
  // verified separately by HASH_MISMATCH.
  CHECK_STORE_ERROR_TYPE_EXCLUSION_RECORD_MISMATCH = 8;
  // Emitted when a frozen idempotency outcome persisted under SubIdempKeys (the
  // proposal hash, the failure reason/message/metadata, or the success log
  // range) does not match the value re-derived from the hash-chained
  // AuditEntry that froze it. The idempotency store is a replay cache; a
  // tampered frozen outcome would otherwise replay an arbitrary error or wrong
  // log range to a duplicate caller. The audit chain is the source of truth.
  CHECK_STORE_ERROR_TYPE_IDEMPOTENCY_MISMATCH = 9;
  // Emitted when the SubAttrIndex registry entries (bucket-scoped Index zone)
  // diverge from the set the checker re-derived by replaying CreateIndex /
  // DropIndex / RemovedMetadataFieldType / DeleteLedger log payloads. The
  // registry is a projection of those audit-bound orders; an entry that has
  // no matching CreateIndex (or that survives an audit-bound DropIndex /
  // ledger deletion) is tampering. The verifier covers presence + identity
  // (Ledger, Id); per-replica build progress lives in IndexVersionState,
  // which legitimately differs across nodes and is not compared.
  CHECK_STORE_ERROR_TYPE_INDEX_MISMATCH = 10;
  // Emitted when a LedgerLogPayload.OrderSkipped projection records a reason
  // that the audit-bound Order.skippable_reasons whitelist does not allow, or
  // a reason classified as KindInternal (structural failure). The OrderSkippedLog
  // sits in the per-log projection which is NOT hash-chain bound, so a tampered
  // skip log would otherwise let a duplicate caller observe a fabricated outcome
  // for an order that should have been rejected hard. The skippable_reasons
  // whitelist on the audit-bound Order is the source of truth.
  CHECK_STORE_ERROR_TYPE_INVALID_SKIP = 11;
  // Emitted when a mirror ledger's stored LedgerBoundaries.last_mirror_v2_log_id
  // does NOT equal the maximum audited MirrorIngest.v2_log_id for that ledger.
  // last_mirror_v2_log_id is the idempotent-replay high-water mark (EN-1550): the
  // FSM enforces a contiguous applied prefix, so at rest the stored value must
  // equal exactly the max audited v2_log_id. A value ABOVE the audit claims to
  // have consumed a source v2 log no audit entry recorded (future ingests wrongly
  // skipped); a value BELOW means the persisted projection lost applied ground —
  // both are corruption. This is a full invariant-#8 equality check, not a bound.
  CHECK_STORE_ERROR_TYPE_MIRROR_V2LOGID_MISMATCH = 12;
  // Emitted when a ledger's stored metadata schema (LedgerInfo.MetadataSchema)
  // diverges from the field-type declarations the checker re-derived by
  // replaying CreateLedger.initial_schema + SetMetadataFieldType /
  // RemovedMetadataFieldType log payloads. The schema is a projection of those
  // audit-bound orders.
  CHECK_STORE_ERROR_TYPE_SCHEMA_MISMATCH = 13;
  // Emitted when a ledger's stored account types (LedgerInfo.AccountTypes)
  // diverge from the set the checker re-derived by replaying AddAccountType /
  // RemoveAccountType log payloads. The account-type chart is a projection of
  // those audit-bound orders.
  CHECK_STORE_ERROR_TYPE_ACCOUNT_TYPE_MISMATCH = 14;
  // Emitted when the audit says a ledger is live (a CreateLedger event with no
  // later DeleteLedger, or a non-deleted ledger in the baseline checkpoint under
  // archiving) but the store has no live LedgerInfo for it — the entry is either
  // absent or tampered to a soft-deleted tombstone. The stored-ledger loops in
  // compareSchema / compareAccountTypes only visit live ledgers Pebble returns,
  // so both shapes would otherwise escape every projection check. This is the
  // reverse of UNKNOWN_LEDGER.
  CHECK_STORE_ERROR_TYPE_MISSING_LEDGER = 15;
  // Emitted when the store holds a live LedgerInfo for a ledger the audit never
  // created (no CreateLedger event, and — under archiving — not present in the
  // baseline). Such a row exposes an unaudited ledger through ListLedgers while
  // carrying no schema/account types the projection passes could otherwise flag.
  // The audit-derived ledger set is never seeded from the live store, so this
  // comparison stays honest.
  CHECK_STORE_ERROR_TYPE_UNAUDITED_LEDGER = 16;
  // Emitted when the reference→txID uniqueness index (SubAttrReference)
  // diverges from the references the checker re-derived by replaying
  // CreatedTransaction / RevertedTransaction log payloads (baseline-seeded
  // under archiving): a stored reference the audit never assigned, a missing
  // reference the audit did assign, or a reference pointing at a different
  // transaction. The index enforces reference idempotency, so a tampered row
  // silently changes which duplicates get rejected.
  CHECK_STORE_ERROR_TYPE_REFERENCE_MISMATCH = 17;
  // Emitted when a ledger's stored LedgerBoundaries diverge from the checker's
  // re-derivation: NextTransactionId / NextLogId / PostingCount / RevertCount
  // from the replayed logs (mirror fill-gap advances and NumscriptExecutionCount
  // decoded from the chain-bound AuditItem orders; baseline-seeded under
  // archiving), and VolumeCount / MetadataCount / ReferenceCount against a
  // recount of the stored attribute rows those counters summarize — the rows
  // themselves are verified entry-by-entry by their own passes.
  // EphemeralEvictedCount / TransientUsedCount are informational and excluded.
  CHECK_STORE_ERROR_TYPE_BOUNDARY_MISMATCH = 18;
  // Emitted when the numscript library projections (SubAttrNumscriptContent
  // immutable version entries and SubAttrNumscriptVersion latest pointers)
  // diverge from the state the checker re-derived by replaying SavedNumscript /
  // DeleteLedger log payloads. Those projections are the source for reads,
  // listing, version history and admission-side reference resolution; a stored
  // content row that has no matching SavedNumscript, an altered content entry,
  // or a latest pointer that is not the greatest saved semver is tampering. The
  // audit chain is the source of truth.
  CHECK_STORE_ERROR_TYPE_NUMSCRIPT_MISMATCH = 19;
  // A reverse-map (0x03) row in the peer read-index store references a
  // metadata field that has no entry in the stored SubAttrIndex registry, or
  // belongs to a ledger the audit chain does not list as live, or is not a
  // well-formed reverse-map key at all. The reverse map is the only read-index
  // limb that cannot be range-deleted by field — its metadata key sits after a
  // fixed-width version block — so field removal must scan and point-delete,
  // and a row missed by that scan is a permanent divergence no other pass can
  // see. Reported per (ledger, namespace, metadata key) with a row count and a
  // sample entity rather than per row: a field dropped on a large ledger can
  // strand millions of rows. The encoding version block is deliberately NOT
  // validated here — current and pending versions legitimately coexist during
  // a per-replica rewrite, and stale versions are reclaimed at boot by
  // purgeOrphanVersions.
  CHECK_STORE_ERROR_TYPE_REVERSE_MAP_ORPHAN = 20;
  // Emitted when the persisted signing-key projection (SubGlobSigningKey)
  // diverges from the key set the checker re-derived from chain-bound
  // RegisterSigningKey / RevokeSigningKey orders: a stored key the audit never
  // registered, a registered key the store lost, altered public-key bytes, a
  // changed parent_key_id, or a row too short to decode. Recovery loads this
  // projection straight into the runtime key store, which admission consults to
  // accept or reject every signed write, so a tampered row changes who may
  // write. Row absence is the only representation of revocation, so a missing
  // key and a resurrected key are both integrity failures.
  CHECK_STORE_ERROR_TYPE_SIGNING_KEY_MISMATCH = 21;
  // Emitted when the persisted require-signatures flag (SubGlobSigningConfig)
  // differs from the value re-derived from chain-bound SetSigningConfig orders.
  // The flag is a single byte that gates signature enforcement cluster-wide, so
  // flipping it silently disables request authenticity. An absent row decodes as
  // false, which is also the checker's initial expected value.
  CHECK_STORE_ERROR_TYPE_SIGNING_CONFIG_MISMATCH = 22;
  // Emitted when signing verification could not cover the whole history:
  // signing state has no TTL, so keys registered before an archive boundary stay
  // authoritative forever and must be re-derived from archived audit entries via
  // cold storage. When cold storage is unavailable or a chapter cannot be read,
  // the pass reports this rather than presenting a partial replay as a clean
  // comparison. Unlike the baseline-seeded passes, signing expectations are
  // never seeded from the live projection -- that would verify old,
  // never-touched keys against a copy of themselves.
  CHECK_STORE_ERROR_TYPE_SIGNING_VERIFICATION_INCOMPLETE = 23;
  // Emitted when the persisted cluster policy (SubGlobClusterPolicy) differs
  // from the policy re-derived from chain-bound SetClusterPolicy orders. The
  // policy gates idempotency expiration and query-checkpoint admission
  // cluster-wide, so a tampered row silently changes replay/expiry and
  // checkpoint behavior. The audit chain is the source of truth.
  CHECK_STORE_ERROR_TYPE_CLUSTER_POLICY_MISMATCH = 24;
  // Emitted when the cluster policy could not be verified over the whole audit
  // history: the policy has no TTL, so a policy set before an archive boundary
  // stays authoritative and must be re-derived from archived audit entries via
  // cold storage. When cold storage is unavailable or a chapter cannot be read,
  // the pass reports this rather than presenting a partial replay as clean.
  CHECK_STORE_ERROR_TYPE_CLUSTER_POLICY_VERIFICATION_INCOMPLETE = 25;
  // Emitted when the persisted query-checkpoint rows (SubGlobQueryCheckpoint)
  // diverge from the set the checker re-derived from chain-bound
  // CreatedQueryCheckpoint / DeletedQueryCheckpoint logs: a stored row the audit
  // never created (or later deleted), a live checkpoint missing its row, or a
  // row whose max_sequence / created_at differs from the audited value. The rows
  // back point-in-time query reads and the FSM's live-count cap, so a tampered
  // row changes which checkpoints exist. See EN-1501.
  CHECK_STORE_ERROR_TYPE_QUERY_CHECKPOINT_MISMATCH = 26;
  // Emitted when hot storage still holds keys inside an ARCHIVED chapter's
  // purge ranges: logs by log sequence, audit entries / audit items / applied
  // proposals by audit sequence. ConfirmArchiveChapter's apply deletes those
  // ranges in the same proposal that marks the chapter ARCHIVED, so resident
  // data under an ARCHIVED registry row means a lost purge or a path that
  // re-ingested archived history without purging it (e.g. a restore rebuilt
  // from a cold-backfilled delta). The canonical copy lives in the chapter's
  // cold-storage object; the hot residue shadows it on read paths that try
  // hot storage first and grows the store without bound.
  CHECK_STORE_ERROR_TYPE_UNPURGED_ARCHIVED_DATA = 27;
}

message CheckStoreError {
  CheckStoreErrorType error_type = 1;
  string message = 2;
  fixed64 log_sequence = 3;
  string ledger = 4;
  string account = 5;
  string asset = 6;
  fixed64 transaction_id = 7;
}

message CheckStoreProgress {
  fixed64 logs_checked = 1;
  fixed64 total_logs = 2;
}

