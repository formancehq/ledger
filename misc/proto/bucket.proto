// Audit Log Messages
// ============================================================================

message ListAuditEntriesRequest {
  // options carries the whole read contract. Audit has NO dedicated top-level
  // filters: ledger scope and outcome selection are expressed through
  // options.filter with bare audit fields (e.g. `ledger == <name>`,
  // `outcome == failure`), exactly like every other filtered list endpoint.
  common.ListOptions options = 1;
}

message GetAuditEntryRequest {
  fixed64 sequence = 1;
}

// ============================================================================
// System Log Messages
// ============================================================================

message ListLogsRequest {
  // ledger is the required ledger name to scope the log listing.
  string ledger = 1;
  common.ListOptions options = 2;
}

message GetLogRequest {
  fixed64 sequence = 1;
  // checkpoint_id, when non-zero, reads from a query checkpoint instead of the live store
  fixed64 checkpoint_id = 2;
}

// ============================================================================
// Events Sinks Messages
// ============================================================================

message GetEventsSinksRequest {}

message GetEventsSinksResponse {
  repeated common.SinkConfig sinks = 1;
  repeated common.SinkStatus sink_statuses = 2;
}

// ============================================================================
// Metadata Schema Messages
// ============================================================================

message GetMetadataSchemaStatusRequest {
  string ledger = 1;
}

message GetMetadataSchemaStatusResponse {
  map<string, MetadataFieldStatus> account_fields = 1;
  map<string, MetadataFieldStatus> transaction_fields = 2;
  map<string, MetadataFieldStatus> ledger_fields = 3;
}

message MetadataFieldStatus {
  common.MetadataType declared_type = 1;
}

// ============================================================================
// Account Analysis Messages
// ============================================================================

message AnalyzeAccountsRequest {
  string ledger = 1;
  // variable_threshold is the max distinct children before a trie node is classified
  // as variable. 0 uses the default (10).
  uint32 variable_threshold = 2;
}

message AnalyzeAccountsResponse {
  repeated AccountPattern patterns = 1;
  fixed64 total_accounts = 2;
}

// AnalyzeProgress reports scan progress for long-running analysis operations.
message AnalyzeProgress {
  fixed64 processed = 1;
  fixed64 total = 2;
  string phase = 3;  // "scanning", "pass1", "pass2"
}

// AnalyzeAccountsEvent wraps progress or result events for the streaming AnalyzeAccounts RPC.
message AnalyzeAccountsEvent {
  oneof type {
    AnalyzeProgress progress = 1;
    AnalyzeAccountsResponse result = 2;
  }
}

// AnalyzeTransactionsEvent wraps progress or result events for the streaming AnalyzeTransactions RPC.
message AnalyzeTransactionsEvent {
  oneof type {
    AnalyzeProgress progress = 1;
    AnalyzeTransactionsResponse result = 2;
  }
}

// AccountPattern describes a discovered address pattern and its statistics.
message AccountPattern {
  string pattern = 1;             // Human-readable pattern (e.g. "users:{userId}")
  fixed64 account_count = 2;       // Number of accounts matching this pattern
  repeated string assets = 3;     // Distinct assets observed for matching accounts
  repeated string metadata_keys = 4; // Distinct metadata keys observed
  repeated PatternSegment segments = 5;
}

// PatternSegment describes one level of a discovered pattern.
message PatternSegment {
  uint32 position = 1;
  PatternSegmentType type = 2;
  string fixed_value = 3;        // Set when type=FIXED
  string variable_name = 4;      // Set when type=VARIABLE
  string inferred_pattern = 5;   // Regex for variable segments
  fixed64 unique_values = 6;      // Count of distinct values for this segment
  repeated string examples = 7;  // Up to 5 example values
}

enum PatternSegmentType {
  PATTERN_SEGMENT_TYPE_FIXED = 0;
  PATTERN_SEGMENT_TYPE_VARIABLE = 1;
}

// ============================================================================
// Transaction Analysis Messages
// ============================================================================

message AnalyzeTransactionsRequest {
  string ledger = 1;
  // variable_threshold is the max distinct children before a trie node is classified
  // as variable. 0 uses the default (10).
  uint32 variable_threshold = 2;
}

message AnalyzeTransactionsResponse {
  repeated FlowPattern flow_patterns = 1;
  fixed64 total_transactions = 2;
  fixed64 total_reverted = 3;
}

message FlowPattern {
  // Human-readable canonical signature, e.g. "users:{id}:main->bank:fees[USD]"
  // (legacy form, no spaces; multi-posting flows join fragments with ";").
  // Colored postings append the color inside the brackets: "...[USD/RED]".
  // The uncolored bucket keeps the bare "[USD]" form, byte-identical to pre-color.
  string signature = 1;
  PostingStructure structure = 2;
  fixed64 transaction_count = 3;
  repeated NormalizedPosting postings = 4;
  TemporalStats temporal = 5;
  repeated AssetVolumeStats volume_stats = 6;
  repeated string metadata_keys = 7;      // Distinct metadata keys observed
}

message NormalizedPosting {
  string source_pattern = 1;       // e.g. "users:{id}:main"
  string destination_pattern = 2;  // e.g. "bank:fees"
  string asset = 3;
  // color discriminates postings on the same (source,destination,asset) but
  // different color buckets in the FSM. Two flows that share addresses and
  // asset but differ in color must produce distinct flow signatures so the
  // analysis endpoint does not silently merge segregated buckets.
  string color = 4;
}

enum PostingStructure {
  POSTING_STRUCTURE_SIMPLE = 0;            // 1 posting
  POSTING_STRUCTURE_MULTI_SOURCE = 1;      // N sources, 1 destination
  POSTING_STRUCTURE_MULTI_DESTINATION = 2; // 1 source, N destinations (split)
  POSTING_STRUCTURE_COMPLEX = 3;           // N sources, N destinations
}

message TemporalStats {
  common.Timestamp first_seen = 1;
  common.Timestamp last_seen = 2;
  double transactions_per_day = 3;
  repeated HourBucket peak_hours = 4;   // 24 entries max
}

message HourBucket {
  uint32 hour = 1;    // 0-23
  fixed64 count = 2;
}

message AssetVolumeStats {
  string asset = 1;
  string total_volume = 2;      // big.Int decimal string
  string average_volume = 3;
  string min_volume = 4;
  string max_volume = 5;
  fixed64 transaction_count = 6;
}

// ============================================================================
// Prepared Query Messages
// ============================================================================

message CreatePreparedQueryRequest {
  string ledger = 1;
  common.PreparedQuery query = 2;
}

message CreatePreparedQueryResponse {}

message UpdatePreparedQueryRequest {
  string ledger = 1;
  string name = 2;
  common.QueryFilter filter = 3;
}

message UpdatePreparedQueryResponse {}

message DeletePreparedQueryRequest {
  string ledger = 1;
  string name = 2;
}

message DeletePreparedQueryResponse {}

message ListPreparedQueriesRequest {
  string ledger = 1;
}

message ListPreparedQueriesResponse {
  repeated common.PreparedQuery queries = 1;
}

message ExecutePreparedQueryRequest {
  string ledger = 1;
  string query_name = 2;
  map<string, common.ParameterValue> parameters = 3;
  uint32 page_size = 4;
  string cursor = 5;
  fixed64 min_log_sequence = 6;
  common.QueryMode mode = 7;
}

message ExecutePreparedQueryResponse {
  oneof result {
    common.PreparedQueryCursor cursor = 1;
    common.AggregateResult aggregate = 2;
  }
}

// ============================================================================
// Index Status Messages
// ============================================================================

message GetIndexStatusRequest {
  // Optional: when set, only IndexEntry rows for this ledger are returned.
  // Leave empty to fetch the union across all ledgers (caller-side filtering
  // becomes unnecessary). The aggregate counters (last_indexed_sequence,
  // last_log_sequence, lag, index_file_size) are global and ignore the
  // filter.
  string ledger = 1;
}

message GetIndexStatusResponse {
  fixed64 last_indexed_sequence = 1;
  fixed64 last_log_sequence = 2;
  fixed64 lag = 3;
  fixed64 index_file_size = 4;
  repeated IndexEntry indexes = 5;
}

// GetIndexRequest identifies a single Index registry entry to fetch.
// Pass an empty ledger to address a bucket-scoped entry (e.g. audit
// indexes); a non-empty ledger addresses the ledger-scoped slot.
message GetIndexRequest {
  string ledger = 1;
  common.IndexID id = 2;
}

// GetIndexEntryStatusRequest identifies a single index whose per-replica
// status view (registry entry + backfill cursor + IndexVersionState) is
// returned.
message GetIndexEntryStatusRequest {
  string ledger = 1;
  common.IndexID id = 2;
}

// IndexEntry joins a ledger's index definition (identifier + audit metadata)
// with its backfill cursor position. Replaces the former IndexBackfillProgress.
//
// current_version + pending_version surface the per-replica forward-
// encoding version state (EN-1323). current_version == 0 means the
// local replica has never finished building this index; > 0 means the
// last completed backfill / rewrite atomic-switched into this version
// and queries served from this replica are reading it. pending_version
// is the in-flight rewrite target on this replica (0 when no rewrite
// is running). Per-replica version numbers are allocated from the
// replica's local high-water mark (a drop+recreate resumes past the
// dropped incarnation's numbers), so they are not comparable to the
// registry row's forward_encoding_version. Clients waiting for an
// initial build poll current_version > 0 && pending_version == 0;
// clients waiting for a RETYPE capture current_version before issuing
// it and poll until it has advanced past that value with
// pending_version == 0 — the pre-retype keyspace stays live during
// the rewrite.
message IndexEntry {
  string ledger = 1;
  common.Index index = 2;     // identifier + created_at + forward_encoding_version
  fixed64 cursor = 3;         // backfill cursor (0 when not in backfill or done)
  uint32 current_version = 4; // per-replica live keyspace; 0 until first switch
  uint32 pending_version = 5; // per-replica in-flight rewrite target; 0 when idle
}

// ListIndexesRequest streams the bucket-scoped index registry.
//
// scope controls which entries are returned:
//   - LEDGER_SCOPE_ALL (0):    return every entry in the registry
//   - LEDGER_SCOPE_BUCKET (1): return only bucket-scoped entries (ledger == "")
//   - LEDGER_SCOPE_LEDGER (2): return entries for the named ledger
//
// Pagination is not needed today — the registry is small enough that one
// stream covers it. If it grows, add a cursor/page_size pair following the
// shared ListOptions contract.
message ListIndexesRequest {
  enum Scope {
    SCOPE_ALL    = 0;
    SCOPE_BUCKET = 1;
    SCOPE_LEDGER = 2;
  }
  Scope scope = 1;
  // ledger is required when scope == SCOPE_LEDGER, ignored otherwise.
  string ledger = 2;
}

message GetLedgerStatsRequest {
  string ledger = 1;
  // checkpoint_id, when non-zero, reads from a query checkpoint instead of the live store
  fixed64 checkpoint_id = 2;
}

message AggregateVolumesRequest {
  string ledger = 1;
  common.QueryFilter filter = 2;
  fixed64 min_log_sequence = 3;
  // When true, assets sharing the same base (e.g. USD/2, USD/4) are merged
  // under the highest precision observed, with lower-precision amounts rescaled.
  bool use_max_precision = 4;
  // When set, results are grouped by account prefix. Each account is assigned
  // to the first matching prefix. Accounts not matching any prefix are excluded.
  repeated string group_by_prefixes = 5;
  // checkpoint_id, when non-zero, reads from a query checkpoint instead of the live store
  fixed64 checkpoint_id = 6;
  // When true, amounts in colored buckets are summed into the uncolored bucket
  // ("" color). Result entries are produced with color = "". By default each
  // (asset, color) bucket yields its own AggregatedVolume entry.
  bool collapse_colors = 7;
}

// ============================================================================
// Query Profile Messages
// ============================================================================

// QueryProfile contains execution statistics for a read query.
// Returned to clients via gRPC trailing metadata when requested.
message QueryProfile {
  int64 index_duration_us = 1;
  int64 enrichment_duration_us = 2;
  int32 items_collected = 3;
  int32 enriched_count = 4;
  int32 materialized_ranges = 5;
  int32 materialized_items = 6;
  IteratorProfile root_iterator = 7;

  // ---- Server-side request timing ----
  //
  // The fields above only cover query EXECUTION. The ones below account for
  // the whole server-side handling of the request, so a caller can tell a slow
  // network from a slow server.

  // Consumer-independent server cost: server entry to the response being ready
  // for delivery, MINUS barrier_duration_us and MINUS deliver_duration_us. It
  // cannot be moved by a slow client.
  //
  // "Server entry" is the earliest instrumentable point on each transport, and
  // that is not quite the same point: on gRPC it is the handler's first
  // statement, because grpc-go receives and unmarshals the request message
  // before dispatching, putting protobuf decode out of reach; on HTTP it is the
  // router chain just before authentication, so query/body decode inside the
  // handler is included. Both start before authentication, and both end at the
  // same place, which is what keeps the field comparable — with the caveat that
  // gRPC message decode is never counted on either side of the comparison.
  //
  // It does NOT include row serialisation. On a gRPC server stream, marshalling
  // and the transport write happen inside one inseparable stream.Send() call, so
  // serialisation is accounted in deliver_duration_us together with consumer
  // back-pressure. Choose accordingly:
  //
  //   - consumer-independent, excludes serialisation:  server_duration_us
  //   - complete server-side cost, includes serialisation but also absorbs
  //     back-pressure on a stream:  server_duration_us + deliver_duration_us
  //
  // Neither is a clean latency-SLO basis on a streaming read: the first omits a
  // real cost that grows with page size, the second admits client behaviour into
  // the signal. Pick the one whose bias is acceptable for the specific SLO and
  // say which. The server's own slow-query threshold uses the sum, so that
  // serialisation and forwarded-read cost cannot hide from it.
  //
  // prepare_duration_us + execute_duration_us <= server_duration_us; the
  // difference is server work outside both phases (response assembly,
  // pagination trailer, profile emission).
  int64 server_duration_us = 8;

  // Portion of server_duration_us spent before the query executor was invoked:
  // authentication, request validation, filter parsing/compilation and
  // checkpoint-store opening — plus, on HTTP, query-parameter and body decoding.
  // gRPC protobuf decode is NOT here: grpc-go unmarshals the request before the
  // handler runs (see server_duration_us).
  int64 prepare_duration_us = 9;

  // Portion of server_duration_us spent inside the query executor. Contains
  // index_duration_us and enrichment_duration_us as sub-phases, plus snapshot
  // setup, ledger/schema resolution and — when rows are produced lazily
  // (a follower routing to the leader) — the time spent pulling rows out of
  // the cursor.
  int64 execute_duration_us = 10;

  // Time blocked on a read-consistency barrier the CALLER asked for: the Raft
  // ReadIndex quorum round-trip and the ReadOptions.min_log_sequence read-index
  // catch-up wait. Deliberately EXCLUDED from server_duration_us — it is a wait
  // the request opted into, not server cost.
  //
  // Only LOCAL waits are measured, and every local wait is measured: a
  // min_log_sequence catch-up and a ReadIndex attempt are both counted, whether
  // or not the attempt succeeds and whether or not the read is then forwarded.
  // Always read this field together with `forwarded`:
  //
  //   - forwarded=false: the whole barrier this read paid.
  //   - forwarded=true, 0: no local wait happened. The remote node's barrier is
  //     folded into its execution and arrives inside execute_duration_us — 0
  //     does NOT mean "no barrier was needed".
  //   - forwarded=true, non-zero: a local wait happened before the read left
  //     this node, and the remote node's barrier is on top of it inside
  //     execute_duration_us. The value does NOT identify which wait: a
  //     min_log_sequence catch-up does not prevent forwarding, and a failed
  //     ReadIndex attempt (syncing follower, leadership lost mid-quorum) is
  //     what triggers the fallback. Do not read cluster health off it.
  //
  // A failed or superseded wait is still excluded from server_duration_us: the
  // caller waited for it, and an abandoned quorum round-trip is no more server
  // work than a completed one.
  int64 barrier_duration_us = 11;

  // Time spent serialising result rows and handing them to the transport.
  // EXCLUDED from server_duration_us because on a server stream it also
  // contains consumer back-pressure, which is client cost, not server cost.
  //
  // On a gRPC server stream this is the sum of the stream.Send() calls
  // (marshal + transport write + flow-control wait). Always 0 on HTTP, where
  // the profile travels in a response header that must be flushed before the
  // body, putting response serialisation out of reach. Since row serialisation
  // is excluded from server_duration_us on both surfaces, that asymmetry does
  // not affect the comparability of the headline number.
  int64 deliver_duration_us = 12;

  // Handler entry to the first row accepted by the transport. Compare against
  // server_duration_us and deliver_duration_us to separate "the server was slow
  // to produce anything" from "the consumer was slow to drain the stream".
  //
  // 0 means no row was ever handed to the transport, which covers three distinct
  // cases: a streaming read that matched nothing, a unary response (HTTP, and
  // the AggregateVolumes / ExecutePreparedQuery RPCs — these never hand rows to
  // a stream), and a streaming read that failed before its first send. Use
  // items_collected and the RPC's own status to tell them apart.
  int64 first_row_duration_us = 13;

  // True when this node did not serve the read itself but forwarded it to
  // another node — an explicit leader-consistency read, or the fallback taken
  // when the local replica is still catching up. The remote node's prepare,
  // barrier and execution all arrive inside execute_duration_us, so the phase
  // breakdown describes the local hop only. Its purpose is to stop a zero
  // barrier_duration_us from being misread as "no barrier was needed"; see that
  // field for the three cases the pair distinguishes — a forwarded read can
  // report a non-zero local wait.
  bool forwarded = 14;
}

// IteratorProfile describes a single iterator node in the query execution tree.
message IteratorProfile {
  string label = 1;
  string kind = 2;
  string bucket = 3;
  int64 next_calls = 4;
  int64 seek_calls = 5;
  repeated IteratorProfile children = 6;
  // Inclusive wall-clock time spent in this node's Next + SeekGE (covers child calls).
  int64 duration_us = 7;
  // Successful Next() calls (rows emitted upward by this node).
  int64 items_emitted = 8;
  // Range materializations performed at this node (typically leaf SliceIterator nodes).
  int32 materialized_ranges = 9;
  // Items drained from Pebble cursors into the materialized SliceIterator.
  int64 materialized_items = 10;
  // For combinator nodes (And/Not/Or): candidates discarded by the merge/converge loop.
  int64 items_skipped = 11;
}

// ============================================================================
// Index Inspection Messages
// ============================================================================

enum InspectIndexMode {
  INSPECT_INDEX_MODE_DISTINCT_VALUES = 0;
  INSPECT_INDEX_MODE_FACETS = 1;
  INSPECT_INDEX_MODE_SUMMARY = 2;
}

message InspectIndexRequest {
  string ledger = 1;
  common.TargetType target_type = 2;
  string metadata_key = 3;
  InspectIndexMode mode = 4;
  uint32 page_size = 5;
  string cursor = 6;
  fixed64 checkpoint_id = 7;
}

message InspectIndexResponse {
  oneof result {
    InspectDistinctValues distinct_values = 1;
    InspectFacets facets = 2;
    InspectSummary summary = 3;
  }
}

message InspectDistinctValues {
  repeated common.MetadataValue values = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message InspectFacet {
  common.MetadataValue value = 1;
  fixed64 count = 2;
}

message InspectFacets {
  repeated InspectFacet facets = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message InspectSummary {
  fixed64 cardinality = 1;
  common.MetadataValue min = 2;
  common.MetadataValue max = 3;
  fixed64 entities_with_key = 4;
  fixed64 entities_with_null = 5;
}

// ============================================================================
// Barrier Messages
// ============================================================================

message BarrierRequest {}

message BarrierResponse {
  // The Raft commit index at which the barrier was applied.
  // Callers can compare successive barrier responses to detect quiescence:
  // if two barriers return the same commit_index, no proposals were committed
  // between them.
  fixed64 commit_index = 1;
}
