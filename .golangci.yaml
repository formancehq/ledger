# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
---
version: "2"

formatters:
  enable:
  - gci
  - gofmt
  - goimports
  settings:
    gci:
      sections:
      - standard
      - default
      - prefix(github.com/formancehq/)
      - localmodule
      custom-order: true

linters:
  default: none
  enable:
  - arangolint
  - asasalint
  - asciicheck
  - bidichk
  - bodyclose
  - canonicalheader
  - copyloopvar
  - decorder
  - dupword
  - durationcheck
  - embeddedstructfieldcheck
  - errcheck
  - errchkjson
  - errorlint
  - exhaustive
  - exptostd
  - fatcontext
  - forbidigo
  - ginkgolinter
  - gocheckcompilerdirectives
  - gochecksumtype
  - gocritic
  - godot
  - goheader
  - gomoddirectives
  - gomodguard_v2
  - goprintffuncname
  - gosmopolitan
  - govet
  - grouper
  - iface
  - importas
  - ineffassign
  - intrange
  - iotamixing
  - loggercheck
  - mirror
  - misspell
  - modernize
  - nakedret
  - nilnesserr
  - nlreturn
  - nolintlint
  - nosprintfhostport
  - perfsprint
  - predeclared
  - promlinter
  - protogetter
  - reassign
  - revive
  - rowserrcheck
  - sloglint
  - sqlclosecheck
  - staticcheck
  - tagalign
  - testableexamples
  - unconvert
  - unqueryvet
  - unused
  - usestdlibvars
  - usetesting
  - wastedassign
  - whitespace
  - zerologlint
  settings:
    lll:
      line-length: 180
    gomoddirectives:
      replace-local: true
      replace-allow-list:
      - github.com/expr-lang/expr
    revive:
      rules:
      - name: package-comments
        disabled: true
    exhaustruct:
      exclude:
      - '.+/cobra\.Command$'
    exhaustive:
      # Only flag switches explicitly tagged with //exhaustive:enforce. This
      # is opt-in to avoid disturbing the existing codebase; the structural
      # guarantee for ErrorKind comes from tagging the two transport
      # switches in adapter/grpc/errors.go and adapter/http/error_handler.go.
      explicit-exhaustive-switch: true
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
      # I2 invariant: writes to the main Pebble store outside the hot path are
      # only allowed from declared lifecycle paths (see capabilities.go).
      # New call sites must be added to the exclusions block below with a
      # justification, never silently introduced.
      - pattern: '\.OpenWriteSession\b'
        msg: |
          OpenWriteSession opens a write session on the main Pebble store. Outside the FSM
          hot path (internal/infra/state/machine.go), it is only allowed from declared
          lifecycle paths (bootstrap, backup, attributes/prepare). New call sites must be
          added to the .golangci.yaml exclusions block with a justification.
      # NewWriteSessionFromDB is a back door that takes a raw *pebble.DB. It
      # bypasses *Store and therefore the OpenWriteSession check above. Only
      # the readstore (which owns a separate Pebble instance) may use it.
      - pattern: '\bNewWriteSessionFromDB\b'
        msg: |
          NewWriteSessionFromDB takes a raw *pebble.DB and bypasses the main-store
          OpenWriteSession check. It is reserved for subsystems that manage their own
          Pebble instance (currently: internal/storage/readstore). New call sites must
          be added to the .golangci.yaml exclusions block with a justification.
      # EN-1379: a bare ErrStorageOperation swallows the reason of an
      # admission-contract violation. buildAuditFailure reads Reason()/Metadata()
      # off the OUTERMOST Describable and never unwraps, so wrapping a
      # *ErrCoverageMiss permanently records an admission bug in the
      # hash-chained audit as STORAGE_OPERATION_FAILED with the identifying key
      # stripped. domain.StoreFailure propagates the violation verbatim.
      - pattern: '\bErrStorageOperation\b'
        msg: |
          Do not construct domain.ErrStorageOperation directly. Use
          domain.StoreFailure(operation, err), which propagates an admission-contract
          violation (coverage miss / invalid execution plan) verbatim so the audit chain
          records COVERAGE_MISS, and wraps everything else as a storage fault. See
          docs/technical/architecture/subsystems/fsm/coverage-gate.md.

          analyze-types is on, so this rule fires on ANY reference whose type resolves
          to ErrStorageOperation outside domain.StoreFailure — not only a composite
          literal. An errors.As target declaration, a field read off such a target and
          a type-switch case are all flagged. A construction-only pattern is not
          expressible here: forbidigo renders the type expression and never the brace.
          If you are legitimately CONSUMING a storage fault (reading Operation for a
          log line, distinguishing an IO fault from a business outcome), the rule has
          no alternative to offer — add //nolint:forbidigo with a justification.
      # EN-1781: pterm's SpinnerPrinter.Start always spawns an animation
      # goroutine, and its Stop cannot terminate it while pterm.RawOutput is
      # set, so the goroutine outlives the command and races with any later
      # write to pterm's package-level configuration.
      - pattern: '\bpterm\.DefaultSpinner\b'
        msg: |
          pterm.DefaultSpinner leaks an animation goroutine that cannot be stopped while
          pterm.RawOutput is set (see EN-1781). Use cmdutil.StartSpinner, which creates no
          pterm spinner when output is non-interactive. The only allowed direct use is
          cmd/ledgerctl/cmdutil/spinner.go.
  exclusions:
    rules:
    # I2 exceptions for OpenWriteSession / NewWriteSessionFromDB.
    # Each path here is part of the declared "may write to a Pebble store" set.
    - path: internal/storage/dal/
      linters: [forbidigo]
    # Hot-path apply opens the write session via the WriteSessionFactory it
    # receives in PrepareEntries. Pin the allow rule to the exact call in the
    # exact file: forbidigo combines path + source with AND, so a stray call
    # outside machine.go (or with a different receiver name) is still flagged.
    - path: internal/infra/state/machine\.go
      linters: [forbidigo]
      source: 'sessions\.OpenWriteSession\(\)'
    - path: internal/infra/attributes/prepare\.go
      linters: [forbidigo]
    - path: internal/infra/backup/
      linters: [forbidigo]
    - path: internal/bootstrap/config_validation\.go
      linters: [forbidigo]
    # peer_store.go persists Raft cluster membership in Pebble. Writes
    # happen at two declared call sites: the ConfChange apply path
    # (finishReady, hot path triggered by Raft) and the bootstrap
    # module's initial-peer registration (before the Raft loop starts).
    # Both go through *Membership methods that wrap *PeerStore — never
    # via a raw OpenWriteSession outside this file. (EN-1413)
    - path: internal/infra/membership/peer_store\.go
      linters: [forbidigo]
    # membership.go owns the ForceRemoveNode atomic batch (peer row
    # delete + RemovedMemberEntry write) via m.store.OpenWriteSession()
    # — cluster-topology lifecycle path, EN-1045. See
    # docs/technical/architecture/subsystems/consensus/removed-member-registry.md.
    - path: internal/infra/membership/membership\.go
      linters: [forbidigo]
    # The readstore manages its own Pebble DB and uses NewWriteSessionFromDB
    # (not OpenWriteSession on the main store).
    - path: internal/storage/readstore/
      linters: [forbidigo]
    # The usagestore is a peer secondary store to readstore, dedicated to the
    # usagebuilder projections. It manages its own Pebble DB and uses
    # NewWriteSessionFromDB by the same rationale.
    - path: internal/storage/usagestore/
      linters: [forbidigo]
    # coverage.go owns the single legitimate ErrStorageOperation construction:
    # domain.StoreFailure is the wrapper every other site must go through, and
    # it is the one place allowed to build the fallback. Pinned by source to that
    # one construction — symmetric with the errors.go rule below — so a second,
    # unintended reference in this file is still caught. (EN-1379)
    - path: internal/domain/coverage\.go
      linters: [forbidigo]
      source: 'ErrStorageOperation\{'
    # ErrStorageOperation's own methods read its fields; with analyze-types the
    # receiver resolves to the forbidden type, so e.Operation / e.Cause are
    # flagged inside the declaration itself. Pinned to those field reads via
    # source so a bare &ErrStorageOperation{...} in errors.go is still caught.
    # (EN-1379)
    - path: internal/domain/errors\.go
      linters: [forbidigo]
      source: 'e\.(Operation|Cause)'
    # EN-1781 does not reach the kubectl-ledger plugin. misc/operator is a
    # separate Go module that cannot import cmd/ledgerctl/cmdutil, it never
    # writes pterm's package-level configuration (no DisableStyling /
    # DisableColor / RawOutput / SetDefaultOutput anywhere in the module), and
    # it is a short-lived plugin process. With no concurrent writer there is no
    # race, only pterm's inherent pattern. Tracked separately rather than
    # duplicating the wrapper across the module boundary.
    #
    # The pattern is not anchored at the start: golangci-lint reports an issue
    # path relative to the run directory, and its analysis cache is keyed by
    # package content, so a cache entry produced in another checkout of the
    # same module replays with that checkout's path (../<other-worktree>/misc/
    # operator/...). An anchored pattern misses those and the exemption
    # silently stops applying.
    - path: (^|/)misc/operator/
      linters: [forbidigo]
    # spinner.go is the sanctioned cmdutil.StartSpinner wrapper for EN-1781 —
    # the one place allowed to touch pterm.DefaultSpinner. spinner_test.go
    # drives the raw printer as the reference implementation in the
    # output-equivalence test.
    - path: cmd/ledgerctl/cmdutil/spinner(_test)?\.go$
      linters: [forbidigo]
    # Tests use OpenWriteSession to seed data; the structural guarantee is on
    # production paths.
    - path: _test\.go$
      linters: [forbidigo]
