config:
  perf:k8s-context: eks-acme-dev-euw1-01
  perf:benchmark:
    script: mixed_read_write
    metadata:
      name: paul-mixed-read-write-beta-10
      namespace: ledger-v3
    spec:
      parallelism: 1
      separate: true
      arguments: "-o opentelemetry"
    resources:
      - manifest:
          apiVersion: ledger.formance.com/v1alpha1
          kind: Cluster
          spec:
            image:
              repository: ghcr.io/formancehq/ledger
              tag: v3.0.0-beta.10
            replicas: 3
            # Pin every benchmark ledger node to the on-demand m8a pool, one
            # benchmark pod per host, so runs are comparable and isolated.
            nodeSelector:
              formance.com/dedicated: ledger-m8a
            tolerations:
              - key: formance.com/dedicated
                operator: Equal
                value: ledger-m8a
                effect: NoSchedule
            additionalLabels:
              benchmark.formance.com/isolated: "true"
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        benchmark.formance.com/isolated: "true"
                    topologyKey: kubernetes.io/hostname
            # Metrics only: OTLP traces/logs at benchmark throughput OOM-kill the
            # shared monitoring collector. Do not add a logs block even with
            # enabled: false, the operator still sets OTEL_LOGS_EXPORTER=otlp.
            monitoring:
              serviceName: ledger
              metrics:
                enabled: true
                exporter: otlp
                endpoint: opentelemetry-collector.monitoring.svc.cluster.local.
                port: "4317"
                mode: grpc
                insecure: "true"
                exporterPushInterval: 15s
                runtime: true
                runtimeMinimumReadMemStatsInterval: 5s
              pyroscope:
                enabled: true
                applicationName: ledger-paul-mixed-read-write-beta-10
                serverAddress: http://pyroscope.monitoring.svc.cluster.local.:4040
            resources:
              requests:
                cpu: "8"
                memory: 16Gi
              limits:
                cpu: "8"
                memory: 16Gi
            auth:
              enabled: false
            pebble:
              memTableSize: 536870912
              memTableStopWritesThreshold: 4
              l0StopWritesThreshold: 24
              lBaseMaxBytes: 4294967296
              cacheSize: 4294967296
              bytesPerSync: 4194304
              walBytesPerSync: 4194304
              maxConcurrentCompactions: 4
            raft:
              compactionMargin: 5000
              proposeQueueCapacity: 4096
              maxSizePerMsg: 4194304
            cache:
              rotationThreshold: 1000
            persistence:
              retentionPolicy:
                whenDeleted: Delete
              data:
                size: 500Gi
                storageClass: io2
              wal:
                size: 15Gi
                storageClass: io2
        readyCondition:
          fieldPath: status.phase
          value: Running
      - manifest:
          apiVersion: ledger.formance.com/v1alpha1
          kind: Ledger
          spec:
            name: ledger0
            clusterRef: paul-mixed-read-write-beta-10-res-0
        readyCondition:
          fieldPath: status.phase
          value: Ready
    runner:
      env:
        LEDGER_NAME: "ledger0"
        HTTP_ADDR: "http://ledger-paul-mixed-read-write-beta-10-res-0:9000"
        # Do not set K6_STAGES: it would override the script scenarios.
        # Same write load as the world_to_bank runs, plus concurrent reads.
        WRITE_MODE: "world_to_bank"
        WRITE_STAGES: "1m:400,5m:800,1m:0"
        READ_RATE: "2000"
        READ_START_DELAY: "1m"
        READ_DURATION: "5m"
        BULK_SIZE: "50"
        K6_OTEL_GRPC_EXPORTER_ENDPOINT: "opentelemetry-collector.monitoring.svc.cluster.local:4317"
        K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
        K6_OTEL_METRICS_FLUSH_INTERVAL: "5s"
        K6_OTEL_SERVICE_NAME: "k6-loadtest"
        GRAFANA_USER: admin
        GRAFANA_PASSWORD: admin
encryptionsalt: v1:JbgSMngVbfs=:v1:W1aPVkPfwxRf6kP+:JHrotRg83fRenW4aYfGHPfg6j26+kA==
