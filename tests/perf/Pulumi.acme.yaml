env: default
bases:
  - acme
config:
  perf:k8s-context: eks-acme-dev-euw1-01
  perf:benchmark:
    script: world_to_bank
    metadata:
      name: acme-world-to-bank
      namespace: ledger-v3
    spec:
      parallelism: 1
      separate: true
      arguments: "-o opentelemetry"
    resources:
      - manifest:
          apiVersion: ledger.formance.com/v1alpha1
          kind: Cluster
          spec:
            replicas: 1
            nodeSelector:
              formance.com/dedicated: ledger-m8a
            tolerations:
              - key: formance.com/dedicated
                operator: Equal
                value: ledger-m8a
                effect: NoSchedule
            additionalLabels:
              benchmark.formance.com/isolated: "true"
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        benchmark.formance.com/isolated: "true"
                    topologyKey: kubernetes.io/hostname
            monitoring:
              serviceName: ledger
              metrics:
                enabled: true
                exporter: otlp
                endpoint: opentelemetry-collector.monitoring.svc.cluster.local.
                port: "4317"
                mode: grpc
                insecure: "true"
                exporterPushInterval: 15s
                runtime: true
                runtimeMinimumReadMemStatsInterval: 5s
              pyroscope:
                enabled: true
                applicationName: ledger-acme-world-to-bank
                serverAddress: http://pyroscope.monitoring.svc.cluster.local.:4040
            resources:
              requests:
                cpu: "8"
                memory: 16Gi
              limits:
                cpu: "8"
                memory: 16Gi
            auth:
              enabled: false
            pebble:
              memTableSize: 536870912
              memTableStopWritesThreshold: 4
              l0StopWritesThreshold: 24
              lBaseMaxBytes: 4294967296
              cacheSize: 4294967296
              bytesPerSync: 4194304
              walBytesPerSync: 4194304
              maxConcurrentCompactions: 4
            raft:
              compactionMargin: 5000
              proposeQueueCapacity: 4096
              maxSizePerMsg: 4194304
            cache:
              rotationThreshold: 1000
            persistence:
              retentionPolicy:
                whenDeleted: Delete
              data:
                size: 500Gi
                storageClass: io2
              wal:
                size: 15Gi
                storageClass: io2
        readyCondition:
          fieldPath: status.phase
          value: Running
      - manifest:
          apiVersion: ledger.formance.com/v1alpha1
          kind: Ledger
          spec:
            name: ledger0
            clusterRef: acme-world-to-bank-res-0
        readyCondition:
          fieldPath: status.phase
          value: Ready
    runner:
      env:
        LEDGER_NAME: "ledger0"
        HTTP_ADDR: "http://acme-world-to-bank-res-0:9000"
        K6_STAGES: "1m:100,5m:100,1m:0"
        BULK_SIZE: "50"
        USE_NUMSCRIPT: "true"
        K6_OTEL_GRPC_EXPORTER_ENDPOINT: "opentelemetry-collector.monitoring.svc.cluster.local:4317"
        K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
        K6_OTEL_METRICS_FLUSH_INTERVAL: "5s"
        K6_OTEL_SERVICE_NAME: "k6-loadtest"
        GRAFANA_USER: admin
        GRAFANA_PASSWORD: admin
