name: Setup Env
description: Setup Nix environment with Go caching
inputs:
  token:
    description: 'A Github PAT'
    required: false
    default: ${{ github.token }}
  go-remote-cache:
    description: >-
      Route Go build outputs through Namespace's remote build cache
      (gocacheprog). Every job using it can write entries that other jobs
      read, so leave it off for jobs that publish release artifacts.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # Restore the Nix store from the Namespace cache volume BEFORE installing
    # Nix, so `nix develop .#ci` reuses the CI dev-shell closure instead of re-fetching
    # it from cache.nixos.org on every run. Must run before Install Nix.
    - name: Set up Nix store cache
      uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1.6.0
      with:
        path: /nix
    - name: Install Nix
      uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
    - name: go env
      id: go-env
      shell: bash
      run: |
        nix develop .#ci --command bash -c "go env | sed -E \"s/^([^=]+)='(.*)'\$/\1=\2/\"" >> "$GITHUB_OUTPUT"
    # Dirty uses the linter's default cache directory; keep it aligned with this path.
    # Jobs on the remote Go build cache do not mount GOCACHE: Go no longer
    # writes build outputs there, and leaving it unmounted keeps their commits
    # from changing the build cache that jobs without it still use. The action
    # drops the empty line left when GOCACHE is omitted.
    - uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1.6.0
      with:
        path: |
          ${{ steps.go-env.outputs.GOMODCACHE }}
          ~/.cache/golangci-lint
          ${{ inputs.go-remote-cache != 'true' && steps.go-env.outputs.GOCACHE || '' }}
    # Go build outputs differ per job (build tags, -race, -cover, GOOS), and the
    # cache volume keeps only the last save per node, so most of them are lost.
    # gocacheprog shares outputs across jobs and nodes through Namespace's
    # remote cache. Its local files stay in RUNNER_TEMP, off the volume, so jobs
    # using it do not change what other jobs fork from the volume. Enabled
    # before the module download so its controller-gen build is served from the
    # remote cache instead of an empty local GOCACHE.
    - name: Enable remote Go build cache
      if: inputs.go-remote-cache == 'true'
      shell: bash
      env:
        GOCACHEPROG_VERSION: 0.0.50
        GOCACHEPROG_LINUX_AMD64_SHA256: 547241e138b87e1b11e9a50b3e21f14ecdc11ffda0a4110da7f5494963de5a16
      run: |
        set -euo pipefail
        [ "$(uname -s)/$(uname -m)" = Linux/x86_64 ] || { echo "gocacheprog is pinned for linux/amd64 only" >&2; exit 1; }
        dir="$RUNNER_TEMP/gocacheprog"
        mkdir -p "$dir/bin" "$dir/cache"
        archive="gocacheprog_${GOCACHEPROG_VERSION}_linux_amd64.tar.gz"
        curl --proto '=https' --proto-redir '=https' -fsSL \
          "https://public.namespaceblobs.com/gocacheprog/releases/v${GOCACHEPROG_VERSION}/${archive}" \
          -o "$dir/$archive"
        echo "${GOCACHEPROG_LINUX_AMD64_SHA256}  $dir/$archive" | sha256sum --check --strict
        tar -xzf "$dir/$archive" -C "$dir/bin" gocacheprog
        echo "GOCACHEPROG=$dir/bin/gocacheprog -tag ledger -cache-dir $dir/cache" >> "$GITHUB_ENV"
    # Namespace keeps the last commit per node and never merges commits, so a
    # job that only needs a few modules would drop the modules other jobs need.
    # Downloading every module here makes each commit carry the full set; on a
    # warm cache this is a no-op. Must run after the cache mount above.
    - name: Download Go modules
      shell: bash
      run: nix develop .#ci --command just go-mod-download
