name: PR Images
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  # Filter before joining concurrency: unrelated labels must not cancel a
  # requested image build. Perf labels also request the exact PR image; the
  # privileged benchmark submission runs separately from trusted default-branch code.
  Build-PR-Image:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' &&
        contains(fromJSON('["build-images", "perf-5m", "perf-10m"]'), github.event.label.name)) ||
       (github.event.action != 'labeled' &&
        (contains(github.event.pull_request.labels.*.name, 'build-images') ||
         contains(github.event.pull_request.labels.*.name, 'perf-5m') ||
         contains(github.event.pull_request.labels.*.name, 'perf-10m'))))
    concurrency:
      group: pr-image-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: namespace-profile-linux-amd64-4vcpu
    permissions:
      # Job-level `permissions:` REPLACES the workflow-level set (it does
      # not merge), so we must restate `contents: read` here — otherwise
      # the checkout action cannot clone this private repo and fails with
      # "repository not found".
      contents: read
      packages: write
    env:
      GOPATH: /tmp/go
      # IMAGE_REPOSITORY can be overridden via a repo-level GitHub Variable
      # (`vars.IMAGE_REPOSITORY`) to publish PR images to a different GHCR
      # location while the repo rename is in flight. Default targets the
      # canonical `formancehq/ledger` published image.
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'ghcr.io/formancehq/ledger' }}
      OPERATOR_IMAGE_REPOSITORY: ${{ vars.OPERATOR_IMAGE_REPOSITORY || 'ghcr.io/formancehq/ledger-operator' }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
          dissociate: true
          # Default checkout on `pull_request` produces a synthetic merge
          # commit. Pin to the PR HEAD so the image tag matches the
          # commit the contributor actually pushed.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Env
        uses: ./.github/actions/default
      - name: Set up Docker Buildx
        uses: namespacelabs/nscloud-setup-buildx-action@d059ed7184f0bc7c8b27e8810cea153d02bcc6dd # v0.0.23
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: NumaryBot
          password: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      - name: Compute image tag
        id: tag
        run: |
          short=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          tag="pr-${{ github.event.pull_request.number }}-${short}"
          image="${IMAGE_REPOSITORY}:${tag}"
          build_image="${image}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          operator_image="${OPERATOR_IMAGE_REPOSITORY}:${tag}"
          {
            echo "tag=${tag}"
            echo "image=${image}"
            echo "build_image=${build_image}"
            echo "operator_image=${operator_image}"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Ledger PR image with GoReleaser
        run: >
          nix develop .#ci --command just docker-build-pr '${{ steps.tag.outputs.build_image }}'
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Build and push Ledger Operator PR image with GoReleaser
        run: >
          nix develop .#ci --command just operator-docker-build-pr '${{ steps.tag.outputs.operator_image }}'
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Summarize image digests
        env:
          image: ${{ steps.tag.outputs.image }}
          build_image: ${{ steps.tag.outputs.build_image }}
          operator_image: ${{ steps.tag.outputs.operator_image }}
        run: |
          nix develop .#perf --command bash -euo pipefail <<'IMAGES'
          digest=$(docker buildx imagetools inspect "$build_image" --format '{{json .Manifest}}' | jq -er '.digest')
          operator_digest=$(docker buildx imagetools inspect "$operator_image" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid Ledger image digest' >&2; exit 1; }
          [[ "$operator_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid Operator image digest' >&2; exit 1; }
          # Keep the existing human-facing PR tag; perf uses build_image directly.
          docker buildx imagetools create --tag "$image" "$build_image@$digest"
          {
            echo "## PR docker images"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${image}\` | \`${digest}\` |"
            echo "| \`${build_image}\` | \`${digest}\` |"
            echo "| \`${operator_image}\` | \`${operator_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          IMAGES
