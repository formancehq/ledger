name: PR Images
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  # Filter before joining concurrency: unrelated labels must not cancel a
  # requested image build. On other PR events, a persistent build-images label remains
  # an opt-in, as it was in Default.
  Wait-for-CI:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'build-images') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'build-images')))
    concurrency:
      group: pr-image-wait-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Wait for the existing Default CI
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { waitForCI } = require('./.github/scripts/pr-image-ci.cjs');
            await waitForCI({ github, context, core });

  Build-PR-Image:
    needs: Wait-for-CI
    concurrency:
      group: pr-image-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: namespace-profile-linux-amd64-4vcpu
    permissions:
      # Job-level `permissions:` REPLACES the workflow-level set (it does
      # not merge), so we must restate `contents: read` here — otherwise
      # the checkout action cannot clone this private repo and fails with
      # "repository not found".
      contents: read
      pull-requests: read
      packages: write
    env:
      GOPATH: /tmp/go
      # IMAGE_REPOSITORY can be overridden via a repo-level GitHub Variable
      # (`vars.IMAGE_REPOSITORY`) to publish PR images to a different GHCR
      # location while the repo rename is in flight. Default targets the
      # canonical `formancehq/ledger` published image.
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'ghcr.io/formancehq/ledger' }}
      OPERATOR_IMAGE_REPOSITORY: ${{ vars.OPERATOR_IMAGE_REPOSITORY || 'ghcr.io/formancehq/ledger-operator' }}
    steps:
      - name: Verify the PR is still current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            if (pr.state !== 'open' ||
                pr.head.sha !== context.payload.pull_request.head.sha ||
                pr.base.sha !== context.payload.pull_request.base.sha ||
                !pr.labels.some(label => label.name === 'build-images')) {
              throw new Error('The PR revision or build-images opt-in changed; refusing to publish.');
            }
      - uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9
        with:
          fetch-depth: 0
          dissociate: true
          # Default checkout on `pull_request` produces a synthetic merge
          # commit. Pin to the PR HEAD so the image tag matches the
          # commit the contributor actually pushed.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Env
        uses: ./.github/actions/default
      - name: Set up Docker Buildx
        uses: namespacelabs/nscloud-setup-buildx-action@d059ed7184f0bc7c8b27e8810cea153d02bcc6dd # v0.0.23
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: NumaryBot
          password: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      - name: Compute image tag
        id: tag
        run: |
          short=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          tag="pr-${{ github.event.pull_request.number }}-${short}"
          image="${IMAGE_REPOSITORY}:${tag}"
          operator_image="${OPERATOR_IMAGE_REPOSITORY}:${tag}"
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "operator_image=${operator_image}" >> "$GITHUB_OUTPUT"
      - name: Build and push Ledger PR image
        run: >
          nix develop .#ci --command just docker-build-pr '${{ steps.tag.outputs.image }}'
      - name: Build and push Ledger Operator PR image
        run: >
          nix develop .#ci --command just operator-docker-build-pr '${{ steps.tag.outputs.operator_image }}'
      - name: Summarize image digests
        if: always()
        run: |
          image='${{ steps.tag.outputs.image }}'
          operator_image='${{ steps.tag.outputs.operator_image }}'
          digest=$(docker buildx imagetools inspect "$image" --format '{{ .Manifest.Digest }}' 2>/dev/null || echo "(inspect failed)")
          operator_digest=$(docker buildx imagetools inspect "$operator_image" --format '{{ .Manifest.Digest }}' 2>/dev/null || echo "(inspect failed)")
          {
            echo "## PR docker images"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${image}\` | \`${digest}\` |"
            echo "| \`${operator_image}\` | \`${operator_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
