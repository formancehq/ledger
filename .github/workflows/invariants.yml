name: Repository Invariants

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - master
      - release/*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: namespace-profile-linux-amd64-4vcpu
    env:
      GOPATH: /tmp/go
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
          dissociate: true
      - name: Setup Env
        uses: ./.github/actions/default
      - name: Check repository invariants
        run: nix develop .#ci --command bash scripts/check-repo-invariants
      - name: Check service protocol revision
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          # pull_request checks out the merge commit, so comparing with the
          # current target tip also catches a revision another PR consumed.
          PROTOCOL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: nix develop .#ci --command just check-protocol-version
