name: Release
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  GoReleaser:
    runs-on: namespace-profile-linux-amd64-4vcpu
    env:
      GOPATH: /tmp/go
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
          dissociate: true
      - name: Setup Env
        uses: ./.github/actions/default
      - name: Set up Docker Buildx
        uses: namespacelabs/nscloud-setup-buildx-action@d059ed7184f0bc7c8b27e8810cea153d02bcc6dd # v0.0.23
      - name: Publish Go module tags
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Unexpected release tag: $version" >&2
            exit 1
          fi

          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"

          previous_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${commit}^" 2>/dev/null || true)"
          publish_proto=false
          publish_client=false

          if [[ -z "$previous_tag" ]]; then
            # The first root release must make both nested modules downloadable
            # before any consumer can resolve the public client contract.
            publish_proto=true
            publish_client=true
          else
            changed_files="$(git diff --name-only "$previous_tag" "$commit")"
            # Only changes to the public projection (or its generated output)
            # advance the shared public module. Backend-only schemas such as
            # internal_state.proto must not create a new public version.
            if grep -qE '^(misc/proto/(common|signature|audit|bucket|cluster|restore)\.proto|pkg/proto/v3/)' <<<"$changed_files"; then
              publish_proto=true
            fi
            if grep -qE '^pkg/client/v3/' <<<"$changed_files"; then
              publish_client=true
            fi
          fi

          publish_module_tag() {
            local tag="$1"
            local existing
            existing="$(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | awk 'END {print $1}')"

            if [[ -n "$existing" ]]; then
              if [[ "$existing" != "$commit" ]]; then
                echo "Tag $tag already points to $existing, expected $commit" >&2
                exit 1
              fi
              echo "Tag $tag already points to $commit"
              return
            fi

            git tag "$tag" "$commit"
            git push origin "refs/tags/$tag"
          }

          if [[ "$publish_client" == true ]]; then
            required_proto_version="$(awk '$1 == "github.com/formancehq/ledger/pkg/proto/v3" { print $2; exit }' pkg/client/v3/go.mod)"
            if [[ -z "$required_proto_version" ]]; then
              echo "The public client does not declare a shared proto version" >&2
              exit 1
            fi

            proto_tag="pkg/proto/${required_proto_version}"
            if ! git ls-remote --tags origin "refs/tags/${proto_tag}" "refs/tags/${proto_tag}^{}" | awk 'NF { found = 1 } END { exit !found }'; then
              # The client module pins the shared proto module independently
              # of the root release tag (for example, an RC may still use
              # the stable proto contract). Publish that exact dependency at
              # this release commit before publishing the client tag, so a
              # downstream consumer never observes an unresolvable client.
              if [[ "$publish_proto" != true ]]; then
                echo "The client requires ${proto_tag}, but no public proto change was detected to publish it" >&2
                exit 1
              fi
              publish_module_tag "$proto_tag"
            fi
          fi

          if [[ "$publish_proto" == true ]]; then
            publish_module_tag "pkg/proto/${version}"
          else
            echo "No public protobuf changes since ${previous_tag}; keeping the existing proto module version"
          fi

          if [[ "$publish_client" == true ]]; then
            publish_module_tag "pkg/client/${version}"
          else
            echo "No public client changes since ${previous_tag}; keeping the existing client module version"
          fi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: NumaryBot
          password: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      - run: >
          nix develop .#ci --command just release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Build and push operator image
        run: >
          nix develop .#ci --command just operator-docker-build ${{ github.ref_name }}
      - name: Publish operator Helm charts
        env:
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          nix develop .#ci --command just operator-helm-publish "$version"
