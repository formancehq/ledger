name: Default
on:
  merge_group:
  push:
    branches:
      - main
      - release/*
      - releases/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened, labeled, edited ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    if: github.event_name == 'pull_request'
    uses: formancehq/ci/.github/workflows/go-pr.yml@v1
    permissions:
      pull-requests: read
      statuses: write

  Dirty:
    uses: formancehq/ci/.github/workflows/go-dirty.yml@v1
    secrets:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}

  Tests:
    uses: formancehq/ci/.github/workflows/go-test.yml@v1
    with:
      enable-codecov: true
    secrets:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  GoReleaser:
    runs-on: namespace-profile-linux-amd64-4vcpu
    permissions:
      id-token: write
      attestations: write
    if: contains(github.event.pull_request.labels.*.name, 'build-images') || contains(github.event.pull_request.labels.*.name, 'deploy-staging') || github.ref == 'refs/heads/main' || github.event_name == 'merge_group'
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - uses: formancehq/ci/actions/setup-release@v1
        with:
          token: ${{ secrets.NUMARY_GITHUB_TOKEN }}

      - run: nix develop --impure --command just release-ci
        env:
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: goreleaser-metadata
          path: |
            dist/*.json
            dist/ledger_checksums.txt
          retention-days: 7
          compression-level: 0

      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ./dist/ledger_checksums.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./dist/*/**

      - run: |
          jq -r '[ .[]|select(.type=="Docker Manifest") | .extra.Digest         ] | to_entries | .[] | ( "digest"+ (.key | tostring) + "=" + .value )' < dist/artifacts.json >> "$GITHUB_OUTPUT"
          jq -r '[ .[]|select(.type=="Docker Manifest") | .name | split(":")[0] ] | to_entries | .[] | ( "name"+ (.key | tostring) + "=" + .value )'   < dist/artifacts.json >> "$GITHUB_OUTPUT"
        id: image_metadata

      - uses: actions/attest-build-provenance@v4
        with:
          subject-digest: ${{ steps.image_metadata.outputs.digest0 }}
          subject-name: ${{ steps.image_metadata.outputs.name0 }}
          push-to-registry: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-digest: ${{ steps.image_metadata.outputs.digest1 }}
          subject-name: ${{ steps.image_metadata.outputs.name1 }}
          push-to-registry: true

  Deploy:
    runs-on: namespace-profile-linux-amd64-2vcpu
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    needs:
      - GoReleaser
      - Tests
    steps:
      - uses: formancehq/ci/actions/deploy-staging@v1
        with:
          component: ledger
          tag: ${{ github.sha }}
          auth-token: ${{ secrets.ARGOCD_REGION_AUTH_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OIDC_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          ts-tags: ${{ vars.TS_TAGS }}
          ts-version: ${{ vars.TS_VERSION }}
          ts-args: ${{ vars.TS_ARGS }}
          ts-retry: ${{ vars.TS_RETRY }}
          ts-timeout: ${{ vars.TS_TIMEOUT }}
          ts-ping: ${{ vars.TS_PING }}
